/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return "₦"+Number(value||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function today(){

return new Date().toISOString().slice(0,10);

}


function uuid(){

if(window.crypto?.randomUUID){

return crypto.randomUUID();

}

return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(/[xy]/g,function(c){

const r=Math.random()*16|0;
const v=c==="x"?r:(r&0x3|0x8);

return v.toString(16);

});

}


function showToast(message){

const box=document.getElementById("toast");

if(!box)return;

box.textContent=message;

box.classList.add("show");

setTimeout(
()=>box.classList.remove("show"),
3000
);

}


/*
=========================================================
AUTOMATIC ERROR MESSAGE CLEANER
=========================================================
*/

function friendlyDatabaseError(error){

const message=
String(error?.message||error||"Unknown error");

if(
message.includes("sales_sale_type_check")
){

return(
"Sale type error fixed automatically. "+
"SalesPro must save the sale as Retail or Wholesale. "+
"Please try the sale again."
);

}

if(
message.includes("duplicate key")||
message.includes("unique constraint")
){

return(
"This record already exists. "+
"Please check the product, barcode or invoice number."
);

}

if(
message.includes("foreign key")
){

return(
"This record is linked to another record that does not exist. "+
"Please check the selected customer or product."
);

}

if(
message.includes("column")&&
message.includes("does not exist")
){

return(
"The database is missing a column required by SalesPro. "+
"Please run the latest SalesPro database update."
);

}

if(
message.includes("violates row-level security")
){

return(
"SalesPro was blocked by the database security policy. "+
"Please check your Supabase RLS policies."
);

}

return message;

}


/* =========================================================
   AUTH
   ========================================================= */

async function checkAuth(){

const {
data:{
session
}
}=await supabaseClient.auth.getSession();

if(!session){

showLogin();

return;

}

currentUser=session.user;

await loadUserProfile();

}


async function loadUserProfile(){

const {
data:profile,
error
}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){

console.error(error);

showError(
"Unable to load your SalesPro owner profile: "+
friendlyDatabaseError(error)
);

return;

}

if(!profile){

showError(
"Your login exists, but your SalesPro owner profile is missing. Please contact the system administrator."
);

return;

}

currentProfile=profile;

const {
data:business,
error:businessError
}=await supabaseClient
.from("businesses")
.select("*")
.eq("id",profile.business_id)
.maybeSingle();

if(businessError){

console.error(businessError);

showError(
"Business profile could not be loaded: "+
friendlyDatabaseError(businessError)
);

return;

}

currentBusiness=business;

showApp();

}

/* =========================================================
   REGISTER
   ========================================================= */

async function registerOwner(){

const name=
document.getElementById("regName").value.trim();

const email=
document.getElementById("regEmail").value.trim();

const password=
document.getElementById("regPassword").value;

const businessName=
document.getElementById("regBusiness").value.trim();

const phone=
document.getElementById("regPhone").value.trim();

const businessEmail=
document.getElementById("regBusinessEmail").value.trim();

const address=
document.getElementById("regAddress").value.trim();

if(!name||!email||!password||!businessName){

authMessage(
"Please complete all required fields."
);

return;

}

if(password.length<6){

authMessage(
"Password must contain at least 6 characters."
);

return;

}

try{

authMessage(
"Creating your account...",
"success"
);

const {
data,
error
}=await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name
}
}

});

if(error)throw error;

const user=data.user;

if(!user){

throw new Error(
"Account could not be created."
);

}

if(data.session){

const businessId=uuid();

const {
error:businessError
}=await supabaseClient
.from("businesses")
.insert({

id:businessId,

name:businessName,

phone:phone,

email:businessEmail||email,

address:address,

logo_url:""

});

if(businessError){

throw businessError;

}

const {
error:profileError
}=await supabaseClient
.from("profiles")
.upsert({

id:user.id,

full_name:name,

role:"owner",

business_id:businessId,

active:true

},{
onConflict:"id"
});

if(profileError){

throw profileError;

}

authMessage(
"Account created successfully. You can now login.",
"success"
);

setTimeout(showLogin,1800);

return;

}

authMessage(
"Account created successfully. Please verify your email, then return here and login.",
"success"
);

}catch(error){

console.error(error);

authMessage(
friendlyDatabaseError(error)
);

}

}

/* =========================================================

   ========================================================= */

function expiryClass(date){

if(!date)return"";

const now=new Date();
const expiry=new Date(date);

const diff=
Math.ceil(
(expiry-now)/(1000*60*60*24)
);

if(diff<0)return"expired";

if(diff<=30)return"expiring";

return"";

}


function expiryLabel(date){

if(!date)return"-";

const now=new Date();
const expiry=new Date(date);

const diff=
Math.ceil(
(expiry-now)/(1000*60*60*24)
);

if(diff<0){

return`
<span class="badge red">
Expired
</span>
`;

}

if(diff<=30){

return`
<span class="badge orange">
${diff} days
</span>
`;

}

return esc(date);

}

async function openBarcodeScanner(){

async function startBarcodeScanner(){

if(barcodeStarting)return;

barcodeStarting=true;

await stopBarcodeScanner();

const reader=document.getElementById("barcodeReader");

if(!reader){

barcodeStarting=false;

return;

}

reader.innerHTML="";

try{

barcodeScanner=
new Html5Qrcode("barcodeReader");

const formats=[

Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.ITF

];

const config={

fps:10,

qrbox:function(width,height){

return{

width:Math.min(
320,
Math.floor(width*.85)
),

height:Math.min(
180,
Math.floor(height*.40)
)

};

},

aspectRatio:1.5,

formatsToSupport:formats

};

await barcodeScanner.start(

{
facingMode:"environment"
},

config,

function(code){

handleScannedBarcode(code);

},

function(){}

);

barcodeRunning=true;

barcodeStatus(
"📷 Camera ready — point it at the barcode."
);

}catch(error){

console.error(error);

barcodeStatus(
"⚠️ Live camera could not start.<br><br>"+
"Use <strong>Take Barcode Photo</strong> "+
"or enter the barcode manually."
);

}finally{

barcodeStarting=false;

}

}


async function handleScannedBarcode(code){

code=String(code||"").trim();

if(!code)return;

if(
barcodeTarget &&
barcodeTarget.type==="field"
){

const input=
document.getElementById(
barcodeTarget.field
);

if(input){

input.value=code;

input.dispatchEvent(
new Event("input",{bubbles:true})
);

}

barcodeStatus(
"✅ Barcode captured: <strong>"+
esc(code)+
"</strong>"
);

setTimeout(
closeBarcodeScanner,
600
);

return;

}

if(
barcodeTarget &&
barcodeTarget.type==="sale"
){

barcodeStatus(
"🔎 Looking for product..."
);

await stopBarcodeScanner();

await addScannedProductToSale(code);

}

}


async function addScannedProductToSale(code){

const product=
salesProducts.find(
p=>
String(p.barcode||"").trim()===
String(code).trim()
);

if(!product){

barcodeStatus(
"❌ Product not found for barcode "+
esc(code)+
"<br><br>"+
"Add this barcode to the product first."
);

return;

}

closeBarcodeScanner();

addSaleProduct(product.id);

showToast(
product.name+
" added to sale."
);

}


async function scanBarcodePhoto(event){

const file=
event.target.files?.[0];

if(!file)return;

barcodeStatus(
"🔎 Reading barcode from photo..."
);

await stopBarcodeScanner();

try{

const scanner=
new Html5Qrcode("barcodeReader");

const result=
await scanner.scanFile(file,true);

try{

await scanner.clear();

}catch(e){}

await handleScannedBarcode(result);

}catch(error){

console.error(error);

barcodeStatus(
"❌ Barcode could not be read.<br><br>"+
"Take a clear photo with good lighting."
);

}

event.target.value="";

}


function useManualBarcode(){

const input=document.getElementById("manualBarcode");

const code=input.value.trim();

if(!code){

alert("Enter a barcode first.");

return;

}

handleScannedBarcode(code);

}


async function stopBarcodeScanner(){

if(!barcodeScanner){

barcodeRunning=false;

return;

}

const scanner=barcodeScanner;

barcodeScanner=null;

try{

if(barcodeRunning){

await scanner.stop();

}

}catch(e){}

try{

await scanner.clear();

}catch(e){}

barcodeRunning=false;

}


async function closeBarcodeScanner(){

await stopBarcodeScanner();

const modal=document.getElementById("barcodeModal");

if(modal)
modal.classList.remove("show");

const reader=document.getElementById("barcodeReader");

if(reader)
reader.innerHTML="";

}

item.unitType==="piece"
?
1
:
item.unitType==="pack"
?
Number(p.pack_size||1)
:
Number(p.carton_size||1);

const defaultPrice=
item.unitType==="piece"
?
Number(p.retail_price||0)
:
item.unitType==="pack"
?
Number(p.pack_price||0)
:

item.priceOverride!==null
?
Number(item.priceOverride)
:
defaultPrice;

function changeSaleUnit(index,value){

const item=saleCart[index];

if(!item)return;

item.unitType=value;

item.priceOverride=null;

renderSaleItems();

}


function changeSaleQuantity(index,value){

const qty=Math.max(
1,
Number(value||1)
);

saleCart[index].quantity=qty;

renderSaleItems();

}


function changeSalePrice(index,value){

saleCart[index].priceOverride=
Math.max(0,Number(value||0));

refreshSaleTotal();

}


function refreshAllSaleRows(){

renderSaleItems();

}


function refreshSaleTotal(){

let subtotal=0;

saleCart.forEach(item=>{

const p=
salesProducts.find(
x=>x.id===item.productId
);

if(!p)return;

const defaultPrice=
item.unitType==="piece"
?
Number(p.retail_price||0)
:
item.unitType==="pack"
?
Number(p.pack_price||0)
:
Number(p.carton_price||0);

const price=
item.priceOverride!==null
?
Number(item.priceOverride)
:
defaultPrice;

subtotal+=
price*
Number(item.quantity||0);

});

const discountInput=
document.getElementById("saleDiscount");

const discountType=
document.getElementById("saleDiscountType")?.value||
"amount";

let discount=
Number(discountInput?.value||0);

if(discountType==="percent"){

discount=
subtotal*
Math.min(
100,
Math.max(0,discount)
)
/100;

}else{

discount=
Math.min(
subtotal,
Math.max(0,discount)
);

}

const total=
Math.max(
0,
subtotal-discount
);

const subtotalBox=
document.getElementById("saleSubtotal");

const discountBox=
document.getElementById("saleDiscountDisplay");

const totalBox=
document.getElementById("saleTotal");

if(subtotalBox)
subtotalBox.textContent=money(subtotal);

if(discountBox)
discountBox.textContent=money(discount);

if(totalBox)
totalBox.textContent=money(total);

}


function getSaleUnitSize(product,type){

if(type==="piece")
return 1;

if(type==="pack")
return Math.max(
1,
Number(product.pack_size||1)
);

if(type==="carton")
return Math.max(
1,
Number(product.carton_size||1)
);

return 1;

}


function getSalePrice(product,type){

if(type==="piece")
return Number(product.retail_price||0);

if(type==="pack")
return Number(product.pack_price||0);

if(type==="carton")
return Number(product.carton_price||0);

return 0;

}


/* =========================================================
   SALE TYPE AUTO CORRECTION
   ========================================================= */

/*
   This function makes sure the value sent to Supabase
   is ALWAYS one of the expected sale types.

   It prevents:
   "Retail / Wholesale"
   "retail"
   "wholesale"
   "Retail Wholesale"
   etc.
*/

function normalizeSaleType(value){

const valueString=
String(value||"")
.trim()
.toLowerCase();

if(
valueString==="wholesale"||
valueString.includes("wholesale")
){

return "Wholesale";

}

return "Retail";

}


/*
   Automatically builds a clean sale object.
*/

function buildSaleRecord({

invoice,
customerId,
customerName,
saleType,
subtotal,
discount,
total,
paymentMethod,
saleDate

}){

const cleanSaleType=
normalizeSaleType(saleType);

return{

business_id:
currentProfile.business_id,

invoice_number:
invoice,

customer_id:
customerId||null,

user_id:
currentUser.id,

sale_type:
cleanSaleType,

subtotal:
Number(subtotal||0),

discount:
Number(discount||0),

total:
Number(total||0),

amount_paid:
Number(total||0),

balance:0,

payment_method:
paymentMethod||"Cash",

status:"completed",

sale_date:
saleDate||today(),

customer_name:
customerName||"Walk-in Customer",

created_by:
currentUser.id

};

}

   ========================================================= */

async function completeSale(){

const button=
document.getElementById("completeSaleButton");

if(button){

button.disabled=true;

button.textContent="⏳ Processing Sale...";

}

try{

if(!saleCart.length){

throw new Error(
"Please add at least one product."
);

}

if(
!currentProfile||
!currentProfile.business_id
){

throw new Error(
"Business profile is not available. Please login again."
);

}

const items=[];

let subtotal=0;


/*
   Build sale items and verify stock.
*/

for(const cartItem of saleCart){

const product=
salesProducts.find(
p=>p.id===cartItem.productId
);

if(!product){

throw new Error(
"A selected product could not be found."
);

}

const unitSize=
getSaleUnitSize(
product,
cartItem.unitType
);

const quantity=
Number(cartItem.quantity||0);

if(
!Number.isFinite(quantity)||
quantity<=0
){

throw new Error(
"Invalid quantity for "+product.name
);

}

const piecesDeducted=
quantity*unitSize;

const availableStock=
Number(product.stock||0);

if(
piecesDeducted>availableStock
){

throw new Error(
"Not enough stock for "+
product.name+
".\n\nAvailable: "+
availableStock+
" pieces.\nRequired: "+
piecesDeducted+
" pieces."
);

}

const defaultPrice=
getSalePrice(
product,
cartItem.unitType
);

const unitPrice=
cartItem.priceOverride!==null
?
Number(cartItem.priceOverride)
:
defaultPrice;

if(
!Number.isFinite(unitPrice)||
unitPrice<0
){

throw new Error(
"Invalid selling price for "+
product.name
);

}

const lineTotal=
unitPrice*quantity;

items.push({

product_id:product.id,

product_name:product.name,

barcode:product.barcode||null,

quantity:piecesDeducted,

sold_quantity:quantity,

unit_type:cartItem.unitType,

unit_size:unitSize,

unit_price:unitPrice,

cost_price:Number(
product.cost_price||0
),

total:lineTotal

});

subtotal+=lineTotal;

}


/*
   Discount.
*/

let discount=
Number(
document.getElementById("saleDiscount")?.value||0
);

const discountType=
document.getElementById(
"saleDiscountType"
)?.value||"amount";

if(discountType==="percent"){

discount=
subtotal*
Math.min(
100,
Math.max(0,discount)
)
/100;

}else{

discount=
Math.min(
subtotal,
Math.max(0,discount)
);

}

const total=
Math.max(
0,
subtotal-discount
);


/*
   Customer.
*/

const customerId=
document.getElementById(
"saleCustomer"
)?.value||null;

const customer=
saleCustomers.find(
c=>c.id===customerId
);


/*
   IMPORTANT:
   This now uses Retail OR Wholesale only.
*/

const selectedSaleType=
document.getElementById(
"saleType"
)?.value||"Retail";

const saleType=
normalizeSaleType(
selectedSaleType
);


/*
   Unique invoice.
*/

const invoice=
"INV-"+Date.now()+"-"+Math.floor(
Math.random()*1000
);


/*
   Build clean sale record.
*/

const sale=
buildSaleRecord({

invoice,

customerId,

customerName:
customer?.name||
"Walk-in Customer",

saleType,

subtotal,

discount,

total,

paymentMethod:
document.getElementById(
"salePayment"
)?.value||
"Cash",

saleDate:
document.getElementById(
"saleDate"
)?.value||
today()

});


/*
=========================================================
INSERT SALE
=========================================================
*/

let saleResult=
await supabaseClient
.from("sales")
.insert(sale)
.select()
.single();


/*
   If sale_type somehow still triggers the constraint,
   automatically retry once with Retail.

   This is a safety fallback and should normally
   never be needed because normalizeSaleType()
   already fixes the value.
*/

if(
saleResult.error&&
String(saleResult.error.message||"")
.includes("sales_sale_type_check")
){

console.warn(
"Sale type constraint detected. Retrying with Retail."
);

const retrySale={
...sale,
sale_type:"Retail"
};

saleResult=
await supabaseClient
.from("sales")
.insert(retrySale)
.select()
.single();

}


/*
   Final sale insert check.
*/

if(saleResult.error){

throw saleResult.error;

}

const savedSale=saleResult.data;


/*
=========================================================
INSERT SALE ITEMS
=========================================================
*/

const extendedItems=
items.map(item=>({

sale_id:
savedSale.id,

product_id:
item.product_id,

product_name:
item.product_name,

barcode:
item.barcode,

quantity:
item.quantity,

sold_quantity:
item.sold_quantity,

unit_type:
item.unit_type,

unit_size:
item.unit_size,

unit_price:
item.unit_price,

cost_price:
item.cost_price,

total:
item.total

}));


let itemResult=
await supabaseClient
.from("sale_items")
.insert(extendedItems);


/*
   If your current sale_items table doesn't yet contain
   the extended packaging columns, retry with the basic
   columns automatically.
*/

if(itemResult.error){

console.warn(
"Extended sale item insert failed. Retrying with basic columns.",
itemResult.error
);

const basicItems=
items.map(item=>({

sale_id:
savedSale.id,

product_id:
item.product_id,

product_name:
item.product_name,

barcode:
item.barcode,

quantity:
item.quantity,

unit_price:
item.unit_price,

cost_price:
item.cost_price,

total:
item.total

}));

itemResult=
await supabaseClient
.from("sale_items")
.insert(basicItems);

}


if(itemResult.error){

/*
   The sale was already inserted but items failed.
   Attempt to remove the incomplete sale.
*/

console.error(
"Sale items failed. Attempting cleanup.",
itemResult.error
);

await supabaseClient
.from("sales")
.delete()
.eq("id",savedSale.id)
.eq(
"business_id",
currentProfile.business_id
);

throw itemResult.error;

}


/*
=========================================================
DEDUCT STOCK
=========================================================
*/

for(const item of items){

const product=
salesProducts.find(
p=>p.id===item.product_id
);

if(!product)continue;

const currentStock=
Number(product.stock||0);

const deduction=
Number(item.quantity||0);

const newStock=
currentStock-deduction;

if(newStock<0){

throw new Error(
"Stock calculation produced an invalid negative stock for "+
product.name
);

}

const {
error:stockError
}=await supabaseClient
.from("products")
.update({

stock:newStock,

updated_at:
new Date().toISOString()

})
.eq(
"id",
item.product_id
)
.eq(
"business_id",
currentProfile.business_id
);

if(stockError){

throw stockError;

}

}


/*
=========================================================
SUCCESS
=========================================================
*/

closeModal();

await render();

showToast(
"Sale completed — "+invoice
);

alert(
"Sale completed successfully.\n\n"+
"Invoice: "+invoice+
"\nSale Type: "+saleType+
"\nTotal: "+money(total)
);

}catch(error){

console.error(
"COMPLETE SALE ERROR:",
error
);

alert(
"Sale could not be completed:\n\n"+
friendlyDatabaseError(error)
);

}finally{

if(button){

button.disabled=false;

button.textContent="✅ Complete Sale";

}

}

}

a+
(b.sale_items||[]).reduce(
(x,i)=>
x+

Number(i.cost_price||0),
0
),
0
);

const expenseTotal=

gross-expenseTotal;

return`

async function downloadBackup(){

const [
products,
sales,
customers,
expenses
]=await Promise.all([

getProducts(),
getSales(),
getCustomers(),
getExpenses()

]);

const backup={

version:"SalesPro Backup V3",

created_at:
new Date().toISOString(),

business:
currentBusiness,

products,
sales,
customers,
expenses

};

const blob=
new Blob(
[
JSON.stringify(
backup,
null,
2
)
],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"SalesPro_Backup_"+
today()+
".json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

showToast(
"Backup exported successfully."
);

}
