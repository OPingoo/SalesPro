<style>
:root{
--navy:#0b2a52;
--blue:#155fa0;
--gold:#c6a15b;
--bg:#f4f6f9;
--white:#fff;
--text:#172033;
--muted:#667085;
--green:#087443;
--red:#b42318;
--border:#e2e6ec;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select,textarea{font:inherit}

button{
border:0;
border-radius:11px;
padding:11px 15px;
font-weight:700;
background:var(--navy);
color:white;
cursor:pointer;
}

button.secondary{
background:#e8edf3;
color:var(--navy);
}

button.green{background:var(--green)}
button.red{background:#fee4e2;color:var(--red)}

input,select,textarea{
width:100%;
border:1px solid #d0d5dd;
border-radius:10px;
padding:11px;
background:white;
outline:none;
}

label{
display:block;
font-size:12px;
font-weight:700;
color:var(--muted);
margin:9px 0 5px;
}

.header{
position:sticky;
top:0;
z-index:20;
background:white;
border-bottom:1px solid var(--border);
}

.brand{
display:flex;
align-items:center;
gap:12px;
padding:10px 14px;
}

.logo{
width:52px;
height:52px;
border-radius:12px;
background:white;
}

.brand strong{
font-size:18px;
display:block;
}

.brand small{
color:var(--muted);
}

.nav{
display:flex;
overflow-x:auto;
gap:7px;
padding:0 12px 10px;
}

.nav button{
white-space:nowrap;
background:#edf2f7;
color:var(--navy);
}

.nav button.active{
background:var(--navy);
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:15px 12px 100px;
}

h1{
font-size:25px;
margin:18px 0 13px;
}

h2{
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.card{
background:white;
border:1px solid var(--border);
border-radius:16px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.04);
margin-bottom:12px;
}

.stat{
font-size:13px;
color:var(--muted);
}

.stat strong{
display:block;
font-size:22px;
color:var(--text);
margin-top:5px;
}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:12px 0;
}

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.full{
grid-column:1/-1;
}

.table{
overflow-x:auto;
background:white;
border:1px solid var(--border);
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

th,td{
padding:11px;
border-bottom:1px solid #edf0f3;
text-align:left;
}

th{
font-size:12px;
background:#f8fafc;
}

.money{
font-weight:800;
}

.good{color:var(--green)}
.bad{color:var(--red)}

.empty{
padding:35px;
text-align:center;
color:var(--muted);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:1000;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.sheet{
background:white;
width:100%;
max-height:94vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px;
}

.actions{
display:flex;
gap:8px;
justify-content:flex-end;
flex-wrap:wrap;
margin-top:15px;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#edf2f7;
font-size:12px;
}

.footer{
text-align:center;
color:var(--muted);
padding:30px 10px;
font-size:12px;
}

.auth{
position:fixed;
inset:0;
z-index:99999;
background:var(--bg);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:auto;
}

.authbox{
width:100%;
max-width:430px;
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 10px 40px rgba(0,0,0,.12);
}

.authbox h1{
text-align:center;
color:var(--navy);
margin:5px 0;
}

.authbox p{
text-align:center;
color:var(--muted);
}

.authlogo{
width:75px;
height:75px;
display:block;
margin:auto;
}

.authmsg{
display:none;
margin-top:12px;
padding:10px;
border-radius:10px;
font-size:14px;
}

.authmsg.show{
display:block;
background:#fee4e2;
color:var(--red);
}

.authmsg.success{
background:#dcfae6;
color:var(--green);
}

.scan{
display:flex;
gap:7px;
}

.scan button{
white-space:nowrap;
}

#scanner{
display:none;
position:fixed;
inset:0;
z-index:999999;
background:rgba(0,0,0,.9);
align-items:center;
justify-content:center;
padding:15px;
}

.scannerbox{
background:white;
width:100%;
max-width:500px;
border-radius:20px;
padding:15px;
}

#reader{
width:100%;
}

.sale-row{
border:1px solid var(--border);
border-radius:14px;
padding:12px;
margin-bottom:10px;
background:#fafbfc;
}

@media(max-width:700px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.formgrid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}
}

@media print{
.header,.toolbar,.noPrint{
display:none!important;
}

.container{
padding:0;
}
}
</style>
</head>

<body>

<script>

"https://olkugewqersskavvcrhm.supabase.co";

const supabaseClient =

<path d="M18 75V52l10-7v30H18z" fill="#123c70"/>
<path d="M34 75V32l10-7v50H34z" fill="#123c70"/>
<path d="M50 75V18l10-8v65H50z" fill="#123c70"/>
<path d="M55 49l20-20h15L68 50l22 25H75L55 56z" fill="#123c70"/>

<div>
<strong>SalesPro</strong>
<small>KC Integrated Global Services</small>
</div>

</div>

<nav class="nav" id="nav"></nav>

</header>


<main class="container" id="app" style="display:none"></main>

<div class="modal" id="modal">
<div class="sheet" id="sheet"></div>
</div>

<div id="scanner">

<div class="scannerbox">

<h2>📷 Scan Barcode</h2>

<div id="reader"></div>

<p id="scanMessage">
Point the camera at a barcode.
</p>

<button style="width:100%"
onclick="closeScanner()">

<script>

/* =====================================================
   GLOBAL
===================================================== */

let currentUser=null;
let profile=null;
let businessId=null;
let currentPage="dashboard";
let scanner=null;

const navItems=[
["dashboard","Dashboard"],
["sales","Sales"],
["products","Products"],
["customers","Customers"],
["expenses","Expenses"],
["reports","Reports"],
["users","Users"],
["backup","Backup"]
];


/* =====================================================
   AUTH
===================================================== */

function msg(text,success=false){

const box=document.getElementById("authMsg");

box.textContent=text;
box.className="authmsg show";

if(success)box.classList.add("success");
}

function showRegister(){

document.getElementById("loginBox").style.display="none";
document.getElementById("registerBox").style.display="block";
document.getElementById("authMsg").className="authmsg";
}

function showLogin(){

document.getElementById("registerBox").style.display="none";
document.getElementById("loginBox").style.display="block";
document.getElementById("authMsg").className="authmsg";
}


/* REGISTER */

async function register(){

const name=document.getElementById("regName").value.trim();
const email=document.getElementById("regEmail").value.trim();
const password=document.getElementById("regPassword").value;

if(!name||!email){
msg("Please complete all fields.");
return;
}

if(password.length<6){
msg("Password must be at least 6 characters.");
return;
}

msg("Creating account...",true);

const {data,error}=await supabaseClient.auth.signUp({
email,
password
});

if(error){
msg(error.message);
return;
}

if(!data.user){
msg("Account could not be created.");
return;
}

if(!data.session){

msg(
"Account created. Check your email to confirm your account, then return and login.",
true
);

showLogin();

return;
}

/*
profiles.id is used as the Auth user ID
because your database structure contains
profiles.id but not profiles.user_id.
*/

const {data:existing}=await supabaseClient
.from("profiles")
.select("id")
.limit(1);

if(existing && existing.length>0){

msg(
"An Owner account already exists. Please ask the Owner to create your account."
);

await supabaseClient.auth.signOut();

return;
}


/* Create business */

const {data:business,error:businessError}=
await supabaseClient
.from("businesses")
.insert({
name:"KC Integrated Global Services"
})
.select()
.single();

if(businessError){
msg(businessError.message);
return;
}

businessId=business.id;


/* Create owner profile */

const {error:profileError}=
await supabaseClient
.from("profiles")
.insert({
id:data.user.id,
full_name:name,
role:"owner",
business_id:business.id,
active:true
});

if(profileError){
msg(profileError.message);
return;
}

await startApp();

}


/* LOGIN */

async function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email||!password){
msg("Enter your email and password.");
return;
}

msg("Signing in...",true);

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
msg(error.message);
return;
}

await startApp();

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

const {data:{user}}=
await supabaseClient.auth.getUser();

if(!user)return;

currentUser=user;

const {data:p,error}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.eq("active",true)
.single();

if(error||!p){

msg(
"Your account exists but no SalesPro profile was found."
);

return;
}

profile=p;
businessId=p.business_id;

document.getElementById("authScreen").style.display="none";
document.getElementById("appHeader").style.display="block";
document.getElementById("app").style.display="block";

renderNav();
render();

}


async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* =====================================================
   NAVIGATION
===================================================== */

function renderNav(){

let items=navItems.filter(item=>{

if(item[0]==="users"){
return ["owner","admin"].includes(profile?.role);
}

return true;

});

document.getElementById("nav").innerHTML=
items.map(item=>`

<button class="${currentPage===item[0]?"active":""}"
onclick="go('${item[0]}')">
${item[1]}
</button>

`).join("")+

`<button onclick="logout()">Logout</button>`;
}

function go(page){

currentPage=page;

renderNav();
render();

window.scrollTo(0,0);
}


/* =====================================================
   RENDER
===================================================== */

function render(){

const app=document.getElementById("app");

if(currentPage==="dashboard")app.innerHTML=dashboard();
if(currentPage==="products")loadProducts();
if(currentPage==="sales")loadSales();
if(currentPage==="customers")loadCustomers();
if(currentPage==="expenses")loadExpenses();
if(currentPage==="reports")loadReports();
if(currentPage==="users")loadUsers();
if(currentPage==="backup")backupPage();

}


/* =====================================================
   DASHBOARD
===================================================== */

async function dashboard(){

document.getElementById("app").innerHTML=`

<h1>Dashboard</h1>

<div class="grid">

<div class="card stat">
Sales
<strong id="dashSales">₦0.00</strong>
</div>

<div class="card stat">
Products
<strong id="dashProducts">0</strong>
</div>

<div class="card stat">
Customers
<strong id="dashCustomers">0</strong>
</div>

<div class="card stat">
Low Stock
<strong id="dashLow">0</strong>
</div>

</div>

<div class="toolbar">

<button onclick="newSale()">
+ New Sale
</button>

<button class="secondary"
onclick="newProduct()">
+ Product
</button>

</div>

<div class="card">

<h2>Welcome</h2>

<p>
<strong>${esc(profile.full_name)}</strong>
</p>

<p>
Role:
<span class="badge">${esc(profile.role)}</span>
</p>

<p>
KC Integrated Global Services
</p>

</div>
`;

const {data:sales}=await supabaseClient
.from("sales")
.select("total")
.eq("business_id",businessId);

const {count:products}=await supabaseClient
.from("products")
.select("*",{count:"exact",head:true})
.eq("business_id",businessId);

const {count:customers}=await supabaseClient
.from("customers")
.select("*",{count:"exact",head:true})
.eq("business_id",businessId);

const {data:stock}=await supabaseClient
.from("products")
.select("stock,low_stock_level")
.eq("business_id",businessId)
.eq("active",true);

const revenue=(sales||[]).reduce(
(a,b)=>a+Number(b.total||0),0
);

const low=(stock||[]).filter(
p=>Number(p.stock)<=Number(p.low_stock_level||0)
).length;

document.getElementById("dashSales").textContent=money(revenue);
document.getElementById("dashProducts").textContent=products||0;
document.getElementById("dashCustomers").textContent=customers||0;
document.getElementById("dashLow").textContent=low;
}

function dashboard(){
return `
<h1>Dashboard</h1>
<div class="grid">
<div class="card stat">Sales<strong id="dashSales">Loading...</strong></div>
<div class="card stat">Products<strong id="dashProducts">Loading...</strong></div>
<div class="card stat">Customers<strong id="dashCustomers">Loading...</strong></div>
<div class="card stat">Low Stock<strong id="dashLow">Loading...</strong></div>
</div>

<div class="toolbar">
<button onclick="newSale()">+ New Sale</button>
<button class="secondary" onclick="newProduct()">+ Product</button>
</div>

<div class="card">
<h2>Welcome</h2>
<p><strong>${esc(profile?.full_name||"")}</strong></p>
<p>Role: <span class="badge">${esc(profile?.role||"")}</span></p>
</div>
`;
}


/* =====================================================
   PRODUCTS
===================================================== */

async function loadProducts(){

document.getElementById("app").innerHTML=`

<h1>Products & Inventory</h1>

<div class="toolbar">

<button onclick="newProduct()">
+ Add Product
</button>

<input
id="productSearch"
placeholder="Search product..."
oninput="filterProducts()"
>

</div>

<div id="productList">
Loading...
</div>
`;

await fetchProducts();

}

let cachedProducts=[];

async function fetchProducts(){

const {data,error}=await supabaseClient
.from("products")
.select("*")
.eq("business_id",businessId)
.eq("active",true)
.order("name");

if(error){

document.getElementById("productList").innerHTML=
`<div class="card">${esc(error.message)}</div>`;

return;
}

cachedProducts=data||[];

showProducts(cachedProducts);

}

function showProducts(list){

if(!list.length){

document.getElementById("productList").innerHTML=
`<div class="card empty">No products found.</div>`;

return;
}

document.getElementById("productList").innerHTML=`

<div class="table">

<table>

<tr>
<th>Product</th>
<th>Barcode</th>
<th>Cost</th>
<th>Retail</th>
<th>Wholesale</th>
<th>Stock</th>
<th>Action</th>
</tr>

${list.map(p=>`

<tr>

<td>
<strong>${esc(p.name)}</strong>
<br>
<small>${esc(p.brand||"")}</small>
</td>

<td>${esc(p.barcode||"-")}</td>

<td>${money(p.cost_price)}</td>

<td>${money(p.retail_price)}</td>

<td>${money(p.wholesale_price)}</td>

<td class="${Number(p.stock)<=Number(p.low_stock_level||0)?"bad":""}">
${p.stock}
</td>

<td>
<button class="secondary"
onclick="editProduct('${p.id}')">
Edit
</button>
</td>

</tr>

`).join("")}

</table>

</div>
`;

}

function filterProducts(){

const q=document.getElementById("productSearch").value.toLowerCase();

showProducts(
cachedProducts.filter(p=>
(p.name||"").toLowerCase().includes(q)||
(p.barcode||"").includes(q)||
(p.brand||"").toLowerCase().includes(q)
)
);

}


/* PRODUCT FORM */

function newProduct(product=null){

openModal(`

<h2>${product?"Edit":"Add"} Product</h2>

<div class="formgrid">

<div class="full">
<label>Product Name</label>
<input id="pName" value="${esc(product?.name||"")}">
</div>

<div>
<label>Barcode</label>

<div class="scan">

<input id="pBarcode"
value="${esc(product?.barcode||"")}"
placeholder="Barcode">

<button type="button"
onclick="scanInto('pBarcode')">
📷
</button>

</div>

</div>

<div>
<label>Category</label>
<input id="pCategory"
value="${esc(product?.category||"")}">
</div>

<div>
<label>Brand</label>
<input id="pBrand"
value="${esc(product?.brand||"")}">
</div>

<div>
<label>Unit</label>
<input id="pUnit"
value="${esc(product?.unit||"piece")}">
</div>

<div>
<label>Cost Price</label>
<input id="pCost" type="number"
value="${product?.cost_price||0}">
</div>

<div>
<label>Retail Price</label>
<input id="pRetail" type="number"
value="${product?.retail_price||0}">
</div>

<div>
<label>Wholesale Price</label>
<input id="pWholesale" type="number"
value="${product?.wholesale_price||0}">
</div>

<div>
<label>Stock</label>
<input id="pStock" type="number"
value="${product?.stock||0}">
</div>

<div>
<label>Low Stock Level</label>
<input id="pLow" type="number"
value="${product?.low_stock_level||5}">
</div>

</div>

<div class="actions">

<button class="secondary"
onclick="closeModal()">
Cancel
</button>

<button onclick="saveProduct('${product?.id||""}')">
Save Product
</button>

</div>
`);

}

async function saveProduct(existing){

const product={

business_id:businessId,

name:document.getElementById("pName").value.trim(),

barcode:document.getElementById("pBarcode").value.trim()||null,

category:document.getElementById("pCategory").value.trim(),

brand:document.getElementById("pBrand").value.trim(),

unit:document.getElementById("pUnit").value.trim()||"piece",

cost_price:Number(document.getElementById("pCost").value||0),

retail_price:Number(document.getElementById("pRetail").value||0),

wholesale_price:Number(document.getElementById("pWholesale").value||0),

stock:Number(document.getElementById("pStock").value||0),

low_stock_level:Number(document.getElementById("pLow").value||5),

active:true
};

if(!product.name){

alert("Enter product name.");

return;
}

let result;

if(existing){

result=await supabaseClient
.from("products")
.update(product)
.eq("id",existing)
.eq("business_id",businessId);

}else{

result=await supabaseClient
.from("products")
.insert(product);
}

if(result.error){

alert(result.error.message);

return;
}

closeModal();

loadProducts();

}

async function editProduct(id){

const {data,error}=await supabaseClient
.from("products")
.select("*")
.eq("id",id)
.single();

if(error){

alert(error.message);
return;
}

newProduct(data);

}


/* =====================================================
   SALES
===================================================== */

async function loadSales(){

document.getElementById("app").innerHTML=`

<h1>Sales</h1>

<div class="toolbar">
<button onclick="newSale()">+ New Sale</button>
</div>

<div id="salesList">
Loading...

function scanSaleProduct(button){

scanInto(null,function(code){

const product=window.saleProducts.find(
p=>p.barcode===code
);

if(!product){

alert("Product with barcode not found.");
return;
}

const row=button.closest(".sale-row");

row.querySelector(".saleProduct").value=product.id;

recalculateSale();

});

}


function recalculateSale(){

let total=0;

const type=document.getElementById("saleType")?.value||"Retail";

document.querySelectorAll(".sale-row").forEach(row=>{

const id=row.querySelector(".saleProduct").value;

const qty=Number(
row.querySelector(".saleQty").value||0
);

const product=window.saleProducts.find(
p=>p.id===id
);

let price=0;

if(product){

price=
type==="Wholesale"
?Number(product.wholesale_price)
:Number(product.retail_price);

}

row.querySelector(".salePrice").textContent=
money(price*qty);

total+=price*qty;

});

const discount=Number(
document.getElementById("saleDiscount")?.value||0
);

total=Math.max(0,total-discount);

document.getElementById("saleGrandTotal").textContent=
money(total);

}


async function completeSale(){

const type=document.getElementById("saleType").value;

const customerId=
document.getElementById("saleCustomer").value||null;

const payment=
document.getElementById("salePayment").value;

const discount=
Number(document.getElementById("saleDiscount").value||0);

const rows=[];

let subtotal=0;

for(const row of document.querySelectorAll(".sale-row")){

const productId=
row.querySelector(".saleProduct").value;

const quantity=
Number(row.querySelector(".saleQty").value||0);

if(!productId||quantity<=0)continue;

const product=
window.saleProducts.find(
p=>p.id===productId
);

if(!product)continue;

if(quantity>Number(product.stock)){

alert(
"Not enough stock for "+product.name
);

return;
}

const price=
type==="Wholesale"
?Number(product.wholesale_price)
:Number(product.retail_price);

const total=price*quantity;

subtotal+=total;

rows.push({
product,
quantity,
price,
total
});

}

if(!rows.length){

alert("Add at least one product.");

return;
}

const total=Math.max(0,subtotal-discount);

const invoice=
"INV-"+Date.now();

const customer=
customerId
?await getCustomer(customerId)
:null;


/* Create sale */

const {data:sale,error:saleError}=
await supabaseClient
.from("sales")
.insert({

business_id:businessId,

invoice_number:invoice,

customer_id:customerId,

user_id:currentUser.id,

created_by:currentUser.id,

sale_type:type,

subtotal:subtotal,

discount:discount,

total:total,

amount_paid:payment==="Credit"?0:total,

balance:payment==="Credit"?total:0,

payment_method:payment,

status:payment==="Credit"?"credit":"completed",

sale_date:new Date().toISOString().slice(0,10),

customer_name:customer?.name||"Walk-in Customer"

})
.select()
.single();

if(saleError){

alert(saleError.message);

return;
}


/* Sale items */

for(const item of rows){

const {error:itemError}=
await supabaseClient
.from("sale_items")
.insert({

sale_id:sale.id,

product_id:item.product.id,

product_name:item.product.name,

barcode:item.product.barcode,

quantity:item.quantity,

unit_price:item.price,

cost_price:item.product.cost_price,

total:item.total

});

if(itemError){

alert(itemError.message);

return;
}


/* Reduce stock */

const newStock=
Number(item.product.stock)-item.quantity;

const {error:stockError}=
await supabaseClient
.from("products")
.update({
stock:newStock,
updated_at:new Date().toISOString()
})
.eq("id",item.product.id)
.eq("business_id",businessId);

if(stockError){

alert(stockError.message);

return;
}

}

closeModal();

alert(
"Sale completed successfully.\n\nInvoice: "+invoice
);

loadSales();

}

>

<button onclick="restoreBackup()">
♻️ Restore Backup
</button>

</div>

<p>
Keep a backup before installing a future SalesPro upgrade.
Your main records are stored in Supabase, while this backup

async function createBackup(){

const backup={

version:"SalesPro V4",

created_at:new Date().toISOString(),

business_id:businessId,

business:null,

products:[],

customers:[],

sales:[],

sale_items:[],

profiles:[]

};


const business=await supabaseClient
.from("businesses")
.select("*")
.eq("id",businessId)
.single();

backup.business=business.data;


const products=await supabaseClient
.from("products")
.select("*")
.eq("business_id",businessId);

backup.products=products.data||[];


const customers=await supabaseClient
.from("customers")
.select("*")
.eq("business_id",businessId);

backup.customers=customers.data||[];


const sales=await supabaseClient
.from("sales")
.select("*")
.eq("business_id",businessId);

backup.sales=sales.data||[];


if(backup.sales.length){

const ids=backup.sales.map(x=>x.id);

const items=await supabaseClient
.from("sale_items")
.select("*")
.in("sale_id",ids);

backup.sale_items=items.data||[];

}


const profiles=await supabaseClient
.from("profiles")
.select("*")
.eq("business_id",businessId);

backup.profiles=profiles.data||[];


const blob=new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);

const file=new File(
[blob],
"SalesPro_Backup_"+new Date().toISOString().slice(0,10)+".json",
{type:"application/json"}
);


/*
On iPhone, Web Share allows the user to save
the backup through the Files app.
*/

if(navigator.share && navigator.canShare){

try{

if(navigator.canShare({files:[file]})){

await navigator.share({
title:"SalesPro Backup",
text:"SalesPro business backup",
files:[file]
});

return;

}

}catch(e){}

}


/* Fallback */

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=file.name;

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

alert(
"Backup created. Save the downloaded file in the iPhone Files app."
);

}


async function restoreBackup(){

const input=document.getElementById("restoreFile");

if(!input.files.length){

alert("Select a backup file first.");

return;
}

const file=input.files[0];

const text=await file.text();

let backup;

try{

backup=JSON.parse(text);

}catch(e){

alert("Invalid SalesPro backup.");

return;
}

if(!backup.products||
!backup.customers||
!backup.sales){

alert("This is not a valid SalesPro backup.");

return;
}

if(!confirm(
"Restore this backup? Existing records with the same IDs may be replaced."
))return;


/*
Products
*/

for(const p of backup.products){

await supabaseClient
.from("products")
.upsert(p,{onConflict:"id"});

}


/*
Customers
*/

for(const c of backup.customers){

await supabaseClient
.from("customers")
.upsert(c,{onConflict:"id"});

}


/*
Sales
*/

for(const s of backup.sales){

await supabaseClient
.from("sales")
.upsert(s,{onConflict:"id"});

}


/*
Sale items
*/

for(const item of (backup.sale_items||[])){

await supabaseClient
.from("sale_items")
.upsert(item,{onConflict:"id"});

}

alert("Backup restored.");

}


/* =====================================================
   BARCODE SCANNER
===================================================== */

function scanInto(inputId,callback){

const modal=document.getElementById("scanner");

modal.style.display="flex";

document.getElementById("scanMessage").textContent=
"Starting camera...";

if(scanner){

try{
scanner.stop();
}catch(e){}

}

scanner=new Html5Qrcode("reader");

scanner.start(

{facingMode:"environment"},

{

fps:10,

qrbox:{
width:280,
height:120
},

formatsToSupport:[

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.ITF

]

},

decodedText=>{

document.getElementById("scanMessage").textContent=
"✅ Barcode: "+decodedText;

if(inputId){

const input=document.getElementById(inputId);

if(input){

input.value=decodedText;

}

}

if(callback)callback(decodedText);

setTimeout(closeScanner,500);

},

()=>{}

).catch(error=>{

document.getElementById("scanMessage").textContent=
"Camera could not start. Please allow camera access in Safari.";

});

}


function closeScanner(){

if(scanner){

scanner.stop()
.then(()=>{

scanner.clear();

})
.catch(()=>{});

}

document.getElementById("scanner").style.display="none";

}

/* =====================================================
   UTILITIES
===================================================== */

function money(value){

return "₦"+
Number(value||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
