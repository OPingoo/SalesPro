<!-- SCANNER MODAL -->

<div id="barcodeScannerModal">

    <div class="barcode-box">

        <h2>📷 Scan Product Barcode</h2>

        <div class="barcode-instruction">
            Allow camera access, then point the camera at the product barcode.
        </div>

        <div id="reader"></div>

        <div id="barcodeStatus">
            Preparing camera...
        </div>

        <div class="barcode-buttons">

            <button
                type="button"
                class="scan-close"
                onclick="closeBarcodeScanner()">
                Close
            </button>

            <button
                type="button"
                class="scan-manual"
                onclick="restartBarcodeScanner()">
                🔄 Restart
            </button>

        </div>

    </div>

</div>


<script>

let salesProBarcodeScanner = null;
let salesProScannerRunning = false;
let salesProScannerStarting = false;


/* ============================================================
   OPEN BARCODE SCANNER
   ============================================================ */

async function openBarcodeScanner(){

    const modal =
        document.getElementById("barcodeScannerModal");

    const status =
        document.getElementById("barcodeStatus");

    if(!modal){
        alert("Barcode scanner window is missing.");
        return;
    }

    modal.classList.add("show");

    status.innerHTML =
        "📷 Starting camera...";

    await stopBarcodeScanner();

    setTimeout(function(){

        startBarcodeScanner();

    },300);
}


/* ============================================================
   START CAMERA
   ============================================================ */

async function startBarcodeScanner(){

    if(salesProScannerStarting){
        return;
    }

    salesProScannerStarting = true;

    const status =
        document.getElementById("barcodeStatus");

    const reader =
        document.getElementById("reader");

    if(!reader){
        salesProScannerStarting = false;
        return;
    }

    reader.innerHTML = "";

    try{

        if(typeof Html5Qrcode === "undefined"){

            throw new Error(
                "Barcode scanner library could not load."
            );

        }

        salesProBarcodeScanner =
            new Html5Qrcode("reader");


        const config = {

            fps:10,

            qrbox:function(
                viewfinderWidth,
                viewfinderHeight
            ){

                let width =
                    Math.floor(viewfinderWidth * 0.85);

                let height =
                    Math.floor(viewfinderHeight * 0.30);

                return {
                    width:Math.max(width,220),
                    height:Math.max(height,100)
                };

            },

            aspectRatio:1.5,

            rememberLastUsedCamera:true,

            formatsToSupport:[

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8,

                Html5QrcodeSupportedFormats.UPC_A,

                Html5QrcodeSupportedFormats.UPC_E,

                Html5QrcodeSupportedFormats.CODE_128,

                Html5QrcodeSupportedFormats.CODE_39,

                Html5QrcodeSupportedFormats.ITF

            ]

        };


        await salesProBarcodeScanner.start(

            {
                facingMode:"environment"
            },

            config,

            function(decodedText){

                barcodeSuccessfullyScanned(
                    decodedText
                );

            },

            function(errorMessage){

                // Normal scanning errors are ignored.

            }

        );


        salesProScannerRunning = true;

        salesProScannerStarting = false;

        status.innerHTML =
            "📷 Camera ready — point at a barcode.";


    }catch(error){

        console.error(
            "SalesPro barcode error:",
            error
        );

        salesProScannerStarting = false;

        salesProScannerRunning = false;

        status.innerHTML =
            "❌ Camera could not start.<br><br>" +
            "Please allow camera access and try again.";

        setTimeout(function(){

            if(
                location.protocol !== "https:" &&
                location.hostname !== "localhost"
            ){

                status.innerHTML +=
                    "<br><br>" +
                    "⚠️ SalesPro must be opened using HTTPS " +
                    "for iPhone camera access.";

            }

        },500);

    }

}


/* ============================================================
   SUCCESSFUL SCAN
   ============================================================ */

async function barcodeSuccessfullyScanned(
    decodedText
){

    if(!decodedText){
        return;
    }

    const status =
        document.getElementById("barcodeStatus");

    status.innerHTML =
        "✅ Barcode found: <strong>" +
        escapeBarcodeText(decodedText) +
        "</strong>";


    /* Put barcode into existing barcode field */

    const barcodeInput =
        document.getElementById("barcode");

    if(barcodeInput){

        barcodeInput.value =
            decodedText;

        barcodeInput.dispatchEvent(
            new Event(
                "input",
                {bubbles:true}
            )
        );

        barcodeInput.dispatchEvent(
            new Event(
                "change",
                {bubbles:true}
            )
        );

    }


    /* Support other possible barcode inputs */

    const possibleIds = [

        "productBarcode",

        "barcodeInput",

        "product-barcode",

        "product_code"

    ];


    possibleIds.forEach(function(inputId){

        const input =
            document.getElementById(inputId);

        if(input){

            input.value =
                decodedText;

            input.dispatchEvent(
                new Event(
                    "input",
                    {bubbles:true}
                )
            );

            input.dispatchEvent(
                new Event(
                    "change",
                    {bubbles:true}
                )
            );

        }

    });


    /*
       If product barcode exists in database,
       automatically select/find the product.
    */

    try{

        if(
            typeof db !== "undefined" &&
            db.products
        ){

            const product =
                db.products.find(function(p){

                    return String(
                        p.barcode || ""
                    ).trim() === String(
                        decodedText
                    ).trim();

                });


            if(product){

                const productSelect =
                    document.querySelector(
                        ".sproduct"
                    );

                if(productSelect){

                    productSelect.value =
                        product.id;

                    productSelect.dispatchEvent(
                        new Event(
                            "change",
                            {bubbles:true}
                        )
                    );

                }

                status.innerHTML =
                    "✅ " +
                    escapeBarcodeText(
                        product.name
                    ) +
                    "<br>" +
                    "Barcode: " +
                    escapeBarcodeText(
                        decodedText
                    );

            }

        }

    }catch(error){

        console.log(
            "Product barcode lookup:",
            error
        );

    }


    /* Stop camera */

    await stopBarcodeScanner();


    /* Small delay before closing */

    setTimeout(function(){

        closeBarcodeScanner();

    },900);

}


/* ============================================================
   STOP CAMERA
   ============================================================ */

async function stopBarcodeScanner(){

    if(!salesProBarcodeScanner){
        return;
    }

    try{

        if(salesProScannerRunning){

            await salesProBarcodeScanner.stop();

        }

    }catch(error){

        console.log(
            "Scanner stop:",
            error
        );

    }


    try{

        await salesProBarcodeScanner.clear();

    }catch(error){

        console.log(
            "Scanner clear:",
            error
        );

    }


    salesProBarcodeScanner = null;

    salesProScannerRunning = false;

    salesProScannerStarting = false;

}


/* ============================================================
   RESTART
   ============================================================ */

async function restartBarcodeScanner(){

    const status =
        document.getElementById("barcodeStatus");

    status.innerHTML =
        "🔄 Restarting camera...";

    await stopBarcodeScanner();

    setTimeout(function(){

        startBarcodeScanner();

    },400);

}


/* ============================================================
   CLOSE
   ============================================================ */

async function closeBarcodeScanner(){

    await stopBarcodeScanner();

    const modal =
        document.getElementById(
            "barcodeScannerModal"
        );

    if(modal){

        modal.classList.remove("show");

    }

    const reader =
        document.getElementById("reader");

    if(reader){

        reader.innerHTML = "";

    }

}


/* ============================================================
   CREATE SCAN BUTTON
   ============================================================ */

function createSalesProBarcodeButton(){

    if(
        document.getElementById(
            "scanBarcodeButton"
        )
    ){

        return;

    }


    let barcodeInput =
        document.getElementById("barcode");


    /* If barcode field already exists */

    if(barcodeInput){

        let button =
            document.createElement("button");

        button.id =
            "scanBarcodeButton";

        button.type =
            "button";

        button.innerHTML =
            "📷 Scan Barcode";

        button.onclick =
            openBarcodeScanner;

        button.style.cssText = `
            margin-top:8px;
            padding:12px 16px;
            border:none;
            border-radius:10px;
            background:#0b2a52;
            color:white;
            font-weight:700;
            font-size:15px;
            cursor:pointer;
        `;

        barcodeInput.parentNode.appendChild(
            button
        );

        return;

    }


    /*
       If the app doesn't have a barcode field,
       we don't force one into the page here.
    */

}


/* ============================================================
   SAFE HTML ESCAPE
   ============================================================ */

function escapeBarcodeText(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ============================================================
   INITIALIZE
   ============================================================ */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            createSalesProBarcodeButton,
            1200
        );

    }
);

</script>

/* =====================================================
   CREATE OWNER ACCOUNT
===================================================== */

async function createOwnerAccount(){

clearAuthMessage();

const fullName=
document.getElementById("signupName").value.trim();

const businessName=
document.getElementById("signupBusiness").value.trim();

const phone=
document.getElementById("signupPhone").value.trim();

const email=
document.getElementById("signupEmail").value.trim();

const password=
document.getElementById("signupPassword").value;

const confirm=
document.getElementById("signupConfirm").value;


if(!fullName){

showAuthMessage("Enter your full name.");

return;

}

if(!businessName){

showAuthMessage("Enter your business name.");

return;

}

if(!email){

showAuthMessage("Enter your email address.");

return;

}

if(password.length<6){

showAuthMessage(
"Password must be at least 6 characters."
);

return;

}

if(password!==confirm){

showAuthMessage(
"Passwords do not match."
);

return;

}


try{

showAuthMessage(
"Creating your account...",
"success"
);


/* -----------------------------------------------------
   STEP 1: CREATE AUTH ACCOUNT
----------------------------------------------------- */

const {data,error}=
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:fullName
}
}

});

if(error)throw error;

let user=data.user;


/* -----------------------------------------------------
   IMPORTANT:
   SUPABASE MAY RETURN USER WITHOUT SESSION
   WHEN EMAIL CONFIRMATION IS ENABLED.
----------------------------------------------------- */

if(!data.session){

showAuthMessage(
"Your account was created. Please check your email and confirm your email address, then return to SalesPro and login.",
"success"
);

return;

}


/* -----------------------------------------------------
   STEP 2: GET THE REAL SESSION
----------------------------------------------------- */

const sessionResult=
await supabaseClient.auth.getSession();

if(sessionResult.error)
throw sessionResult.error;

const session=
sessionResult.data.session;

if(!session){

throw new Error(
"Supabase session was not available after registration."
);

}

user=session.user;


/* -----------------------------------------------------
   STEP 3: CREATE BUSINESS
----------------------------------------------------- */

const businessId=uuid();

const {
data:business,
error:businessError
}=await supabaseClient
.from("businesses")
.insert({

id:businessId,

name:businessName,

phone:phone,

email:email

})
.select()
.single();

if(businessError){

console.error(
"BUSINESS ERROR:",
businessError
);

throw new Error(
"Account created, but the business profile could not be created. "+
businessError.message
);

}


/* -----------------------------------------------------
   STEP 4: CREATE OWNER PROFILE
   IMPORTANT:
   id = AUTH USER UUID
----------------------------------------------------- */

const {
data:profile,
error:profileError
}=await supabaseClient
.from("profiles")
.insert({

id:user.id,

full_name:fullName,

role:"owner",

business_id:business.id,

active:true

})
.select()
.single();


if(profileError){

console.error(
"PROFILE ERROR:",
profileError
);


/*
If profile failed, do not pretend registration succeeded.
*/

throw new Error(
"Account created, but the owner profile could not be created. "+
profileError.message
);

}


/* -----------------------------------------------------
   SUCCESS
----------------------------------------------------- */

showAuthMessage(
"Owner account created successfully. Loading SalesPro...",
"success"
);

await loadApplication();

}catch(error){

console.error(
"OWNER REGISTRATION ERROR:",
error
);

showAuthMessage(
error.message || "Account creation failed."
);

}

}

===================================================== */

async function loadApplication(){

try{

const {
data:{user},
error
}=await supabaseClient.auth.getUser();

if(error)throw error;

if(!user){

showLogin();

return;

}

currentUser=user;


/* -----------------------------------------------------
   GET PROFILE
----------------------------------------------------- */

let {
data:profile,
error:profileError
}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(profileError)
throw profileError;


if(!profile){

document.getElementById("mainApp").style.display="none";

document.getElementById("authScreen").style.display="flex";

showAuthMessage(
"Your login exists, but your SalesPro owner profile is missing. Please contact the system administrator."
);

return;

}

currentProfile=profile;


/* -----------------------------------------------------
   GET BUSINESS
----------------------------------------------------- */

const {
data:business,
error:businessError
}=await supabaseClient
.from("businesses")
.select("*")
.eq("id",profile.business_id)
.maybeSingle();

if(businessError)
throw businessError;

if(!business){

throw new Error(
"Business profile could not be found."
);

}

currentBusiness=business;


/* -----------------------------------------------------
   SHOW APP
----------------------------------------------------- */

document.getElementById("authScreen").style.display="none";

document.getElementById("mainApp").style.display="block";

document.getElementById("businessHeader").textContent=
business.name;

document.getElementById("currentUserName").textContent=
profile.full_name+" • "+profile.role;

render();

}catch(error){

console.error(error);

document.getElementById("authScreen").style.display="flex";

document.getElementById("mainApp").style.display="none";

showAuthMessage(
error.message || "Unable to load SalesPro."
);

}

}

const input=
document.getElementById(scannerTarget);

}


setTimeout(closeScanner,700);

},

(error)=>{

}

)

"📷 Camera ready — scan a barcode.";

})

.catch(error=>{

document.getElementById("scanResult").textContent=

});

},300);

}

}

scannerTarget=null;

}

function scanSaleBarcode(button){

const row=
button.closest(".card");

const select=
row.querySelector(".sproduct");


const temporaryId=
"saleBarcodeTarget_"+Date.now();


const hidden=
document.createElement("input");

hidden.id=temporaryId;

hidden.style.display="none";

document.body.appendChild(hidden);


openScanner(temporaryId);


const observer=setInterval(async()=>{

if(hidden.value){

clearInterval(observer);


const barcode=hidden.value;

const products=await getProducts();

const product=products.find(
p=>String(p.barcode||"")===String(barcode)
);


if(product){

select.value=product.id;

updateSaleTotal();

}else{

alert(
"No product found with barcode: "+
barcode
);

}

hidden.remove();

}

},300);


setTimeout(()=>{

clearInterval(observer);

if(hidden.parentNode)
hidden.remove();

},30000);

}

type==="Wholesale"
?Number(p.wholesale_price||0)
:Number(p.retail_price||0);

}


row.querySelector(".sprice").textContent=
money(price);


total+=price*qty;

});


const totalBox=
document.getElementById("saleTotal");

if(totalBox)
totalBox.textContent=money(total);

}


/* =====================================================
   COMPLETE SALE
===================================================== */

async function completeSale(){

if(!hasRole(["owner","manager","cashier"])){

alert("You do not have permission to make sales.");

return;

}


const products=await getProducts();

const rows=
document.querySelectorAll(
"#saleItems .card"
);


const type=
document.getElementById("saleType").value;


const items=[];

let subtotal=0;


for(const row of rows){

const pid=
row.querySelector(".sproduct").value;

const qty=
Number(row.querySelector(".sqty").value||0);


if(!pid||qty<=0)continue;


const p=
products.find(x=>x.id===pid);


if(!p){

continue;

}


if(qty>Number(p.stock||0)){

alert(
"Not enough stock for "+p.name+
". Available: "+p.stock
);

return;

}


const unitPrice=
type==="Wholesale"
?Number(p.wholesale_price||0)
:Number(p.retail_price||0);


const total=
qty*unitPrice;


items.push({

product_id:p.id,

product_name:p.name,

barcode:p.barcode||null,

quantity:qty,

unit_price:unitPrice,

cost_price:Number(p.cost_price||0),

total:total

});


subtotal+=total;

}


if(!items.length){

alert("Add at least one product.");

return;

}


const customerId=
document.getElementById("saleCustomer").value||null;


let customerName="Walk-in Customer";


if(customerId){

const customers=await getCustomers();

const customer=
customers.find(c=>c.id===customerId);

if(customer)
customerName=customer.name;

}


const invoice=
"INV-"+Date.now();


const payment=
document.getElementById("salePayment").value;


const saleData={

business_id:currentBusiness.id,

invoice_number:invoice,

customer_id:customerId,

user_id:currentUser.id,

sale_type:type,

subtotal:subtotal,

discount:0,

total:subtotal,

amount_paid:
payment==="Credit"?0:subtotal,

balance:
payment==="Credit"?subtotal:0,

payment_method:payment,

status:
payment==="Credit"?"credit":"completed",

sale_date:
document.getElementById("saleDate").value,

customer_name:customerName,

created_by:currentUser.id

};


const {
data:sale,
error:saleError
}=
await supabaseClient
.from("sales")
.insert(saleData)
.select()
.single();


if(saleError){

alert(saleError.message);

console.error(saleError);

return;

}


/* -----------------------------------------------------
   SALE ITEMS
----------------------------------------------------- */

const itemRows=
items.map(item=>({

sale_id:sale.id,

product_id:item.product_id,

product_name:item.product_name,

barcode:item.barcode,

quantity:item.quantity,

unit_price:item.unit_price,

cost_price:item.cost_price,

total:item.total

}));


const {
error:itemError
}=
await supabaseClient
.from("sale_items")
.insert(itemRows);


if(itemError){

console.error(itemError);

alert(
"Sale was created but sale items could not be saved: "+
itemError.message
);

return;

}


/* -----------------------------------------------------
   UPDATE STOCK
----------------------------------------------------- */

for(const item of items){

const product=
products.find(
p=>p.id===item.product_id
);


if(!product)continue;


const newStock=
Number(product.stock||0)-
Number(item.quantity);


const {
error:stockError
}=
await supabaseClient
.from("products")
.update({
stock:newStock
})
.eq("id",product.id)
.eq("business_id",currentBusiness.id);


if(stockError){

console.error(stockError);

}

}


closeModal();

alert(
"Sale completed successfully.\n\nInvoice: "+
invoice+
"\nTotal: "+
money(subtotal)
);

go("sales");

}

/* =====================================================
   PHONE BACKUP
===================================================== */

async function createPhoneBackup(){

const products=await getProducts();

const customers=await getCustomers();

const sales=await getSales();


const backup={

version:"SalesPro Cloud Backup V1",

created_at:new Date().toISOString(),

business:currentBusiness,

profile:currentProfile,

products:products,

customers:customers,

sales:sales

};


const blob=
new Blob(
[
JSON.stringify(backup,null,2)
],
{
type:"application/json"
}
);


const url=
URL.createObjectURL(blob);


const link=
document.createElement("a");


link.href=url;

link.download=
"SalesPro_Backup_"+
today()+
".json";


document.body.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);


alert(
"Backup created successfully. Save the file somewhere safe on your phone."
);

}


/* =====================================================
   RESTORE PHONE BACKUP
===================================================== */

async function restorePhoneBackup(event){

const file=
event.target.files[0];


if(!file)return;


if(!confirm(
"Restore this backup? Existing matching records may be replaced."
)){

event.target.value="";

return;

}


const reader=
new FileReader();


reader.onload=async function(){

try{

const backup=
JSON.parse(reader.result);


if(!backup.products||
!backup.customers||
!backup.sales){

throw new Error(
"Invalid SalesPro backup."
);

}


/* Restore products */

for(const product of backup.products){

const copy={...product};

delete copy.id;

delete copy.created_at;

delete copy.updated_at;

copy.business_id=currentBusiness.id;

const {error}=
await supabaseClient
.from("products")
.upsert(
copy,
{
onConflict:"business_id,barcode"
}
);

if(error){

console.error(error);

}

}


/* Restore customers */

for(const customer of backup.customers){

const copy={...customer};

delete copy.id;

delete copy.created_at;

copy.business_id=currentBusiness.id;

const {error}=
await supabaseClient
.from("customers")
.insert(copy);

if(error){

console.error(error);

}

}


alert(
"Backup restoration completed. Please check your Products and Customers."
);


go("dashboard");


}catch(error){

console.error(error);

alert(
"Invalid SalesPro backup file."
);

}

};


reader.readAsText(file);

event.target.value="";

}
