<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://olkugewqersskavvcrhm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_35hM0m_Gy7HVDmgs-CoEvA_QcJMv3te";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   APPLICATION STATE
   ===================================================== */

let currentUser=null;
let currentProfile=null;
let currentBusiness=null;

let page="dashboard";

let barcodeScanner=null;
let barcodeRunning=false;
let barcodeStarting=false;


/* =====================================================
   HELPERS
   ===================================================== */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return "₦"+Number(value||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}


function today(){

return new Date().toISOString().slice(0,10);

}


function uuid(){

return crypto.randomUUID();

}


/* =====================================================
   AUTH
   ===================================================== */

async function checkAuth(){

const {
data:{
session
}
}=await supabaseClient.auth.getSession();

if(!session){

showLogin();

return;

}

currentUser=session.user;

await loadUserProfile();

}


async function loadUserProfile(){

const {
data:profile,
error
}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){

console.error(error);

showError(
"Unable to load your SalesPro profile."
);

return;

}

if(!profile){

showError(
"Your login exists, but your SalesPro owner profile is missing. Please contact the system administrator."
);

return;

}

currentProfile=profile;

const {
data:business,
error:businessError
}=await supabaseClient
.from("businesses")
.select("*")
.eq("id",profile.business_id)
.maybeSingle();

if(businessError){

console.error(businessError);

}

currentBusiness=business;

showApp();

}


/* =====================================================
   LOGIN SCREEN
   ===================================================== */

function showLogin(){

document.getElementById("root").innerHTML=`

<div class="auth">

<div class="authCard">

<div id="authMessage"></div>

<div id="authLogo"></div>

<h1>SalesPro</h1>

</div>

id="loginEmail"

id="loginPassword"

placeholder="Password">

style="width:100%;margin-top:15px"
onclick="loginUser()">

</button>

New to SalesPro?

<button onclick="showRegister()">
Create Owner Account
</button>

</div>

</div>

</div>

</div>
`;

}


function showRegister(){

document.getElementById("root").innerHTML=`

<div class="auth">

<div class="authCard">

<div id="authMessage"></div>

<h1>Create Owner Account</h1>

<div class="authBusiness">
KC Integrated Global Services
</div>

<label>Full Name</label>

<input
id="regName"
type="text"
placeholder="Your full name">

<label>Email Address</label>

<input
id="regEmail"
type="email"
placeholder="Email address">

<label>Password</label>

<input
id="regPassword"
type="password"
placeholder="Minimum 6 characters">

<hr>

<h2>Business Information</h2>

<label>Business Name</label>

<input
id="regBusiness"
value="KC Integrated Global Services">

<label>Phone</label>

<input
id="regPhone"
placeholder="Business phone">

<label>Email</label>

<input
id="regBusinessEmail"
placeholder="Business email">

<label>Address</label>

<textarea
id="regAddress"
placeholder="Business address"></textarea>

<div class="actions">

<button
class="secondary"
onclick="showLogin()">
Back
</button>

<button
onclick="registerOwner()">
Create Account
</button>

</div>

</div>

</div>

`;

}


function authMessage(text,type="error"){

const box=
document.getElementById(
"authMessage"
);

if(!box)return;

box.innerHTML=
`<div class="${type}">
${esc(text)}
</div>`;

}


/* =====================================================
   REGISTER
   ===================================================== */

async function registerOwner(){

const name=
document.getElementById("regName").value.trim();

const email=
document.getElementById("regEmail").value.trim();

const password=
document.getElementById("regPassword").value;

const businessName=
document.getElementById("regBusiness").value.trim();

const phone=
document.getElementById("regPhone").value.trim();

const businessEmail=
document.getElementById("regBusinessEmail").value.trim();

const address=
document.getElementById("regAddress").value.trim();

if(!name||!email||!password||!businessName){

authMessage(
"Please complete all required fields."
);

return;

}

if(password.length<6){

authMessage(
"Password must contain at least 6 characters."
);

return;

}

try{

authMessage(
"Creating your account...",
"success"
);


/*
 Create authentication user.
*/

const {
data,
error
}=await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name
}
}

});


if(error){

throw error;

}


const user=data.user;

if(!user){

throw new Error(
"Account could not be created."
);

}


/*
 The database triggers/RLS should create
 the profile if configured.

 We create business first only if
 the session is available.
*/

if(data.session){

const businessId=uuid();


const {
error:businessError
}=await supabaseClient
.from("businesses")
.insert({

id:businessId,

name:businessName,

phone:phone,

email:businessEmail||email,

address:address,

logo_url:""

});


if(businessError){

console.error(
businessError
);

authMessage(
"Account created, but the business profile could not be created: "+
businessError.message
);

return;

}


/*
 Create owner profile.
*/

const {
error:profileError
}=await supabaseClient
.from("profiles")
.upsert({

id:user.id,

full_name:name,

role:"owner",

business_id:businessId,

active:true

},{
onConflict:"id"
});


if(profileError){

console.error(
profileError
);

authMessage(
"Account created, but the owner profile could not be created: "+
profileError.message
);

return;

}


authMessage(
"Account created successfully. You can now login.",
"success"
);

setTimeout(
showLogin,
1800
);

return;

}


/*
 Email confirmation is enabled.
*/

authMessage(
"Account created successfully. Please check your email and verify your account before logging in.",
"success"
);


}catch(error){

console.error(error);

authMessage(
error.message||"Registration failed."
);

}

}


/* =====================================================
   LOGIN
   ===================================================== */

async function loginUser(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;

if(!email||!password){

authMessage(
"Enter your email and password."
);

return;

}

try{

authMessage(
"Signing in...",
"success"
);

const {
error
}=await supabaseClient.auth.signInWithPassword({

email,
password

});


if(error){

throw error;

}

await checkAuth();

}catch(error){

console.error(error);

authMessage(
error.message||"Login failed."
);

}

}

   LOGOUT
   ===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

currentProfile=null;

currentBusiness=null;

showLogin();

}

   APP
   ===================================================== */

document.getElementById("root").innerHTML=`

}


/* =====================================================
   NAVIGATION
   ===================================================== */

const navItems=[

["dashboard","Dashboard"],

["sales","Sales"],

["products","Products"],

["customers","Customers"],

["expenses","Expenses"],

["reports","Reports"],

["backup","Backup"],

["settings","Settings"]

];


function renderNav(){

const nav=
document.getElementById("nav");

if(!nav)return;

nav.innerHTML=
navItems.map(item=>`

<button
class="${page===item[0]?"active":""}"
onclick="go('${item[0]}')">

${item[1]}

</button>

`).join("");

}


function go(p){

page=p;

renderNav();

render();

window.scrollTo(
0,
0
);

}


async function render(){

const app=
document.getElementById("app");

if(!app)return;

if(page==="dashboard")
app.innerHTML=
await dashboard();

if(page==="sales")
app.innerHTML=
await salesPage();

if(page==="products")
app.innerHTML=
await productsPage();

if(page==="customers")
app.innerHTML=
await customersPage();

if(page==="expenses")
app.innerHTML=
await expensesPage();

if(page==="reports")
app.innerHTML=
await reportsPage();

if(page==="backup")
app.innerHTML=
backupPage();

if(page==="settings")
app.innerHTML=
settingsPage();

}


/* =====================================================
   DASHBOARD
   ===================================================== */

async function dashboard(){

const products=
await getProducts();

const sales=
await getSales();

const expenses=
await getExpenses();

const revenue=
sales.reduce(
(a,b)=>a+Number(b.total||0),
0
);

const cost=
sales.reduce(
(a,b)=>
a+
(b.sale_items||[]).reduce(
(x,i)=>
x+
Number(i.quantity||0)*
Number(i.cost_price||0),
0
),
0
);

const expenseTotal=
expenses.reduce(
(a,b)=>a+Number(b.amount||0),
0
);

const profit=
revenue-cost-expenseTotal;

const stockValue=
products.reduce(
(a,b)=>
a+
Number(b.stock||0)*
Number(b.cost_price||0),
0
);

return`

<h1>Dashboard</h1>

<div class="grid">

<div class="card stat">

Total Sales

<strong>
${money(revenue)}
</strong>

</div>

<div class="card stat">

Net Profit

<strong
class="${profit>=0?"good":"bad"}">

${money(profit)}

</strong>

</div>

<div class="card stat">

Products

<strong>
${products.length}
</strong>

</div>

<div class="card stat">

Stock Value

<strong>
${money(stockValue)}
</strong>

</div>

</div>

<div class="toolbar">

<button onclick="newSale()">
+ New Sale
</button>

<button
class="secondary"
onclick="newProduct()">
+ Add Product
</button>

</div>

<div class="card">

<h2>Low Stock</h2>

${lowStockTable(products)}

</div>

<div class="card">

<h2>Recent Sales</h2>

${recentSales(sales)}

</div>

<div class="footer">

SalesPro •
${esc(
currentBusiness?.name||
"KC Integrated Global Services"
)}

</div>

`;

}


function lowStockTable(products){

const low=
products.filter(
p=>
Number(p.stock||0)<=
Number(p.low_stock_level||0)
);

if(!low.length){

return `
<div class="empty">
No low-stock products.
</div>
`;

}

return `

<div class="table">

<table>

<tr>

<th>Product</th>

<th>Barcode</th>

<th>Stock</th>

<th>Alert Level</th>

</tr>

${low.map(p=>`

<tr class="lowStock">

<td>
<strong>${esc(p.name)}</strong>
</td>

<td>
${esc(p.barcode||"-")}
</td>

<td class="bad">
${p.stock}
</td>

<td>
${p.low_stock_level}
</td>

</tr>

`).join("")}

</table>

</div>

`;

}


/* =====================================================
   PRODUCTS
   ===================================================== */

async function getProducts(){

const {
data,
error
}=await supabaseClient
.from("products")
.select("*")
.eq("business_id",currentProfile.business_id)

async function startBarcodeScanner(){

if(
barcodeStarting||
barcodeRunning
)return;

barcodeStarting=true;

await stopBarcodeScanner();

const reader=
document.getElementById(
"barcodeReader"
);

reader.innerHTML="";

try{

barcodeScanner=
new Html5Qrcode(
"barcodeReader"
);

const formats=[

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.ITF

];

const config={

fps:10,

qrbox:function(width,height){

return{

width:Math.min(
300,
Math.floor(width*.82)
),

height:Math.min(
160,
Math.floor(height*.35)
)

};

},

aspectRatio:1.5,

formatsToSupport:formats

};


await barcodeScanner.start(

{
facingMode:"environment"
},

config,

function(code){

handleScannedBarcode(code);

},

function(){

}
);

barcodeRunning=true;

barcodeStatus(
"📷 Camera ready — point it at the barcode."
);

}catch(error){

console.error(
"Barcode camera error:",
error
);

barcodeStatus(
"⚠️ Live camera could not start.<br><br>"+
"Use <strong>Take Barcode Photo</strong> "+
"or enter the barcode manually."
);

}finally{

barcodeStarting=false;

}

}


function handleScannedBarcode(code){

code=
String(code||"").trim();

if(!code)return;

const input=
document.getElementById(
barcodeTargetId
);

if(input){

input.value=code;

input.dispatchEvent(
new Event(
"input",
{bubbles:true}
)
);

input.dispatchEvent(
new Event(
"change",
{bubbles:true}
)
);

}

barcodeStatus(
"✅ Barcode captured: <strong>"+
esc(code)+
"</strong>"
);

stopBarcodeScanner();

setTimeout(
closeBarcodeScanner,
700
);

}


async function scanBarcodePhoto(event){

const file=
event.target.files?.[0];

if(!file)return;

barcodeStatus(
"🔎 Reading barcode from photo..."
);

await stopBarcodeScanner();

try{

const scanner=
new Html5Qrcode(
"barcodeReader"
);

const result=
await scanner.scanFile(
file,
true
);

try{

await scanner.clear();

}catch(e){}

handleScannedBarcode(result);

}catch(error){

console.error(error);

barcodeStatus(
"❌ Barcode could not be read from this photo.<br><br>"+
"Take a clear photo with the barcode straight and well lit."
);

}

event.target.value="";

}


function useManualBarcode(){

const input=
document.getElementById(
"manualBarcode"
);

const code=
input.value.trim();

if(!code){

alert(
"Enter a barcode first."
);

return;

}

handleScannedBarcode(code);

}


async function stopBarcodeScanner(){

if(!barcodeScanner){

barcodeRunning=false;

return;

}

const old=
barcodeScanner;

barcodeScanner=null;

try{

if(barcodeRunning){

await old.stop();

}

}catch(e){

console.log(e);

}

try{

await old.clear();

}catch(e){

console.log(e);

}

barcodeRunning=false;

}


async function closeBarcodeScanner(){

await stopBarcodeScanner();

document
.getElementById("barcodeModal")
.classList.remove("show");

document
.getElementById("barcodeReader")
.innerHTML="";

}

function backupPage(){

return`

<h1>Backup & Data Protection</h1>

<div class="card">

<h2>📱 Backup to Phone</h2>

<p>

SalesPro can save a complete backup file
to your iPhone's Files app.

</p>

<div class="toolbar">

<button
onclick="downloadBackup()">

📥 Export Backup

</button>

<button
class="secondary"
onclick="document.getElementById('restoreFile').click()">

📤 Restore Backup

</button>

<input
id="restoreFile"
type="file"
accept=".json"
style="display:none"
onchange="restoreBackup(event)">

</div>

<p>
<strong>
Always export a backup before installing a new SalesPro version.
</strong>
</p>

</div>

`;

}


async function downloadBackup(){

const [
products,
sales,
customers,
expenses
]=await Promise.all([

getProducts(),

getSales(),

getCustomers(),

getExpenses()

]);


const backup={

version:"SalesPro Cloud Backup V1",

created_at:
new Date().toISOString(),

business:
currentBusiness,

products,

sales,

customers,

expenses

};


const blob=
new Blob(
[
JSON.stringify(
backup,
null,
2
)
],
{
type:"application/json"
}
);


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");

a.href=url;

a.download=
"SalesPro_Backup_"+
today()+
".json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);


alert(
"Backup created. On iPhone, choose Save to Files and keep it somewhere safe."
);

}


async function restoreBackup(event){

const file=
event.target.files?.[0];

if(!file)return;

try{

const text=
await file.text();

const backup=
JSON.parse(text);

if(
!backup.products||
!backup.sales||
!backup.customers
){

throw new Error(
"Invalid SalesPro backup."
);

}

alert(
"Backup file verified. Cloud restore should be handled carefully to avoid duplicate records."
);

}catch(error){

alert(
"Invalid SalesPro backup file."
);

}

event.target.value="";

}

/* =====================================================
   SALE ROW REFRESH
   ===================================================== */

window.refreshSaleRows=function(){

let total=0;

document
.querySelectorAll(".saleItem")
.forEach(row=>{

const productId=
row.querySelector(
".saleProduct"
).value;

const qty=
Number(
row.querySelector(
".saleQty"
).value||0
);

const product=
window.salesProducts?.find(
p=>p.id===productId
);

const type=
document.getElementById(
"saleType"
)?.value||
"Retail";

const price=
product?
(
type==="Wholesale"
?
Number(product.wholesale_price||0)
:
Number(product.retail_price||0)
):
0;

row.querySelector(
".saleItemPrice span"
).textContent=
money(price);

total+=price*qty;

});

const totalBox=
document.getElementById(
"saleTotal"
);

if(totalBox){

totalBox.textContent=
money(total);

}

};


/* =====================================================
   COMPLETE SALE
   ===================================================== */

window.completeSale=async function(){

const rows=
document.querySelectorAll(
".saleItem"
);

const type=
document.getElementById(
"saleType"
).value;

const items=[];

let total=0;


for(const row of rows){

const productId=
row.querySelector(
".saleProduct"
).value;

const quantity=
Number(
row.querySelector(
".saleQty"
).value||0
);

if(!productId||quantity<=0)
continue;

const product=
window.salesProducts.find(
p=>p.id===productId
);

if(!product)
continue;

if(
quantity>
Number(product.stock||0)
){

alert(
"Not enough stock for "+
product.name
);

return;

}

const unitPrice=
type==="Wholesale"
?
Number(product.wholesale_price||0)
:
Number(product.retail_price||0);

const lineTotal=
unitPrice*quantity;

items.push({

product_id:
product.id,

product_name:
product.name,

barcode:
product.barcode,

quantity,

unit_price:
unitPrice,

cost_price:
Number(product.cost_price||0),

total:
lineTotal

});

total+=lineTotal;

}


if(!items.length){

alert(
"Add at least one product."
);

return;

}


const invoice=
"INV-"+Date.now();

const customerId=
document.getElementById(
"saleCustomer"
).value||null;

const customer=
window.salesCustomers?.find(
c=>c.id===customerId
);


const sale={

business_id:
currentProfile.business_id,

invoice_number:
invoice,

customer_id:
customerId,

user_id:
currentUser.id,

sale_type:
type,

subtotal:
total,

discount:0,

total:
total,

amount_paid:
total,

balance:0,

payment_method:
document.getElementById(
"salePayment"
).value,

status:"completed",

sale_date:
document.getElementById(
"saleDate"
).value,

customer_name:
customer?.name||
"Walk-in Customer",

created_by:
currentUser.id

};


try{

const {
data,
error
}=await supabaseClient
.from("sales")
.insert(sale)
.select()
.single();

if(error){

throw error;

}


const saleItems=
items.map(item=>({

...item,

sale_id:
data.id

}));


const {
error:itemError
}=await supabaseClient
.from("sale_items")
.insert(saleItems);

if(itemError){

throw itemError;

}


/*
 Update stock.
*/

for(const item of items){

const product=
window.salesProducts.find(
p=>p.id===item.product_id
);

await supabaseClient
.from("products")
.update({

stock:
Number(product.stock)-
Number(item.quantity),

updated_at:
new Date().toISOString()

})
.eq(
"id",
item.product_id
)
.eq(
"business_id",
currentProfile.business_id
);

}


closeModal();

await render();

alert(
"Sale completed successfully.\n"+
"Invoice: "+
invoice
);

}catch(error){

console.error(error);

alert(
"Sale could not be completed:\n"+
error.message
);

}

};
