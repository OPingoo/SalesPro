/* =========================================================

/* =========================================================

   ========================================================= */

const SUPABASE_URL =
"https://olkugewqersskavvcrhm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_35hM0m_Gy7HVDmgs-CoEvA_QcJMv3te";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   LOCAL APPLICATION STATE
   ========================================================= */

let currentUser=null;
let currentProfile=null;
let currentBusiness=null;

let page="dashboard";

let products=[];
let sales=[];
let customers=[];
let expenses=[];

let scanner=null;
let scannerRunning=false;


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function money(value){

return "₦"+Number(value||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}

function today(){

return new Date().toISOString().slice(0,10);

}

function invoiceNumber(){

const d=new Date();

return "INV-"+

d.getFullYear()+

String(d.getMonth()+1).padStart(2,"0")+

String(d.getDate()).padStart(2,"0")+

"-"+

String(Date.now()).slice(-6);

}

function showLoading(show){

document.getElementById("loading").style.display=
show?"flex":"none";

}

</div>

function authMessage(text,type="error"){

const box=document.getElementById("authMessage");

if(box){

box.innerHTML=
`<div class="message ${type}">
${esc(text)}
</div>`;

}

}


/* =========================================================
   CREATE OWNER ACCOUNT
   ========================================================= */

async function createOwnerAccount(){

const name=
document.getElementById("signupName").value.trim();

const business=
document.getElementById("signupBusiness").value.trim();

const phone=
document.getElementById("signupPhone").value.trim();

const email=
document.getElementById("signupEmail").value.trim();

const password=
document.getElementById("signupPassword").value;

const password2=
document.getElementById("signupPassword2").value;


if(!name){

authMessage("Please enter your full name.");

return;

}

if(!business){

authMessage("Please enter your business name.");

return;

}

if(!email){

authMessage("Please enter your email address.");

return;

}

if(password.length<6){

authMessage("Password must be at least 6 characters.");

return;

}

if(password!==password2){

authMessage("Passwords do not match.");

return;

}

showLoading(true);

try{

/* CREATE SUPABASE AUTH USER */

const {data,error}=

await supabaseClient.auth.signUp({

email:email,

password:password

});

if(error)throw error;

if(!data.user){

throw new Error(
"Account could not be created."
);

}

currentUser=data.user;


/* CREATE BUSINESS */

const {data:businessData,error:businessError}=

await supabaseClient
.from("businesses")
.insert({

name:business,

phone:phone,

email:email

})
.select()
.single();


if(businessError){

/*
If business creation fails because of a
database policy, tell the user clearly.
*/

throw new Error(
"Account created, but the business profile could not be created. " +
businessError.message
);

}

currentBusiness=businessData;


/* CREATE PROFILE */

const {data:profileData,error:profileError}=

await supabaseClient
.from("profiles")
.insert({

id:data.user.id,

full_name:name,

role:"owner",

business_id:businessData.id,

active:true

})
.select()
.single();


if(profileError){

throw new Error(
"Account created, but the owner profile could not be created. " +
profileError.message
);

}

currentProfile=profileData;

authMessage(
"Owner account created successfully. Loading SalesPro...",
"success"
);

setTimeout(

async function(){

await loadApplication();

},

800

);

}catch(error){

console.error(error);

authMessage(
error.message ||
"Unable to create owner account."
);

}finally{

showLoading(false);

}

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;

if(!email||!password){

authMessage(
"Please enter your email and password."
);

return;

}

showLoading(true);

try{

const {data,error}=

await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});

if(error)throw error;

currentUser=data.user;

await loadApplication();

}catch(error){

console.error(error);

authMessage(
error.message ||
"Login failed."
);

}finally{

showLoading(false);

}

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;
currentBusiness=null;

products=[];
sales=[];
customers=[];
expenses=[];

showLogin();

}


/* =========================================================
   LOAD APPLICATION
   ========================================================= */

async function loadApplication(){

showLoading(true);

try{

const {
data:{user},
error
}=await supabaseClient.auth.getUser();

if(error)throw error;

if(!user){

showLogin();

return;

}

currentUser=user;


/* GET PROFILE */

const {data:profile,error:profileError}=

await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(profileError)throw profileError;

if(!profile){

throw new Error(
"No SalesPro profile was found for this account."
);

}

if(profile.active===false){

throw new Error(
"This user account has been disabled."
);

}

currentProfile=profile;


/* GET BUSINESS */

const {data:business,error:businessError}=

await supabaseClient
.from("businesses")
.select("*")
.eq("id",profile.business_id)
.single();

if(businessError)throw businessError;

currentBusiness=business;


/* LOAD DATA */

await loadProducts();

await loadCustomers();

await loadSales();

await loadExpenses();


document.getElementById("authScreen").style.display="none";

document.getElementById("mainScreen").style.display="block";

document.getElementById("loggedUser").textContent=
user.email||"";

document.getElementById("businessHeader").textContent=
business.name||"KC Integrated Global Services";

renderNav();

render();

}catch(error){

console.error(error);

showLogin();

authMessage(
error.message ||
"Unable to load SalesPro."
);

}finally{

showLoading(false);

}

}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts(){

const {data,error}=

await supabaseClient
.from("products")
.select("*")
.eq("business_id",currentBusiness.id)
.eq("active",true)
.order("name");

if(error)throw error;

products=data||[];

}


/* =========================================================
   LOAD CUSTOMERS
   ========================================================= */

async function loadCustomers(){

const {data,error}=

await supabaseClient
.from("customers")
.select("*")
.eq("business_id",currentBusiness.id)
.order("name");

if(error)throw error;

customers=data||[];

}


/* =========================================================
   LOAD SALES
   ========================================================= */

async function loadSales(){

const {data,error}=

await supabaseClient
.from("sales")
.select("*")
.eq("business_id",currentBusiness.id)
.order("created_at",{ascending:false});

if(error)throw error;

sales=data||[];

}


/* =========================================================
   LOAD EXPENSES
   ========================================================= */

async function loadExpenses(){

/*
Your supplied database structure does not contain
an expenses table.

Therefore this version keeps expenses locally until
an expenses table is added.
*/

const local=
localStorage.getItem(
"SALESPRO_EXPENSES_"+currentBusiness.id
);

expenses=local?JSON.parse(local):[];

}


/* =========================================================
   SAVE LOCAL EXPENSES
   ========================================================= */

function saveExpensesLocal(){

localStorage.setItem(
"SALESPRO_EXPENSES_"+currentBusiness.id,
JSON.stringify(expenses)
);

}


/* =========================================================
   NAVIGATION
   ========================================================= */

const navItems=[

["dashboard","Dashboard"],

["sales","Sales"],

["products","Products"],

["customers","Customers"],

["expenses","Expenses"],

["reports","Reports"],

["backup","Backup"],

["settings","Settings"]

document.getElementById("nav").innerHTML=

navItems.map(item=>`

<button

${item[1]}

page=p;

renderNav();

render();

window.scrollTo(0,0);

products.reduce(

Number(b.stock||0)*
Number(b.cost_price||0),0

return`

<div class="toolbar">

+ New Sale

onclick="newProduct()">
+ Add Product

onclick="newCustomer()">
+ Customer
</button>

</div>

<div class="card">

<h2>Recent Sales</h2>

${recentSales()}

</div>

<div class="card">

<h2>Quick Information</h2>

<p>
Business:
<strong>
${esc(currentBusiness?.name||"")}
</strong>
</p>

<p>
Logged in as:
<strong>
${esc(currentProfile?.full_name||"")}
</strong>
</p>

<p>
Role:
<span class="badge">
${esc(currentProfile?.role||"")}
</span>
</p>

</div>

<div class="footer">

SalesPro V4 •

/* =========================================================
   SALE CALCULATION
   ========================================================= */

function updateSaleTotal(){

let subtotal=0;

document.querySelectorAll(
"#saleItems .sale-row"
).forEach(row=>{

const productId=
row.querySelector(".sproduct").value;

const qty=
Number(
row.querySelector(".sqty").value||0
);

const product=
products.find(
p=>p.id===productId
);

const type=
document.getElementById("saleType")?.value
||"Retail";

const price=

product?

(
type==="Wholesale"
?
Number(product.wholesale_price)
:
Number(product.retail_price)
)

:0;

row.querySelector(".sprice").textContent=
money(price);

subtotal+=price*qty;

});

const discount=
Number(
document.getElementById("saleDiscount")?.value||0
);

const total=
Math.max(0,subtotal-discount);

const paid=
Number(
document.getElementById("salePaid")?.value||0
);

const balance=
Math.max(0,total-paid);

if(document.getElementById("saleSubtotal"))

document.getElementById("saleSubtotal")
.textContent=money(subtotal);

if(document.getElementById("saleDiscountDisplay"))

document.getElementById("saleDiscountDisplay")
.textContent=money(discount);

if(document.getElementById("saleTotal"))

document.getElementById("saleTotal")
.textContent=money(total);

if(document.getElementById("saleBalance"))

document.getElementById("saleBalance")
.textContent=money(balance);

}


/* =========================================================
   COMPLETE SALE
   ========================================================= */

async function completeSale(){

const rows=
document.querySelectorAll(
"#saleItems .sale-row"
);

const items=[];

let subtotal=0;

for(const row of rows){

const productId=
row.querySelector(".sproduct").value;

const quantity=
Number(
row.querySelector(".sqty").value||0
);

if(!productId||quantity<=0)
continue;

const product=
products.find(
p=>p.id===productId
);

if(!product)continue;

if(quantity>Number(product.stock)){

alert(
"Not enough stock for "+product.name
);

return;

}

const saleType=
document.getElementById("saleType").value;

const unitPrice=

saleType==="Wholesale"

?
Number(product.wholesale_price)

:
Number(product.retail_price);

const total=
quantity*unitPrice;

subtotal+=total;

items.push({

productId,

productName:product.name,

barcode:product.barcode||"",

quantity,

unitPrice,

costPrice:Number(product.cost_price||0),

total

});

}

if(!items.length){

alert(
"Add at least one product."
);

return;

}

const discount=
Number(
document.getElementById("saleDiscount").value||0
);

const total=
Math.max(0,subtotal-discount);

const amountPaid=
Number(
document.getElementById("salePaid").value||0
);

const balance=
Math.max(0,total-amountPaid);

const customerId=
document.getElementById("saleCustomer").value||null;

const customer=
customers.find(
c=>c.id===customerId
);

const saleId=
crypto.randomUUID();

showLoading(true);

try{

/* CREATE SALE */

const {data:sale,error:saleError}=

await supabaseClient
.from("sales")
.insert({

id:saleId,

business_id:currentBusiness.id,

invoice_number:invoiceNumber(),

customer_id:customerId,

user_id:currentUser.id,

created_by:currentUser.id,

sale_type:
document.getElementById("saleType").value,

subtotal,

discount,

total,

amount_paid:amountPaid,

balance,

payment_method:
document.getElementById("salePayment").value,

status:
balance>0?"partial":"paid",

sale_date:
document.getElementById("saleDate").value,

customer_name:
customer?.name||"Walk-in Customer"

})
.select()
.single();

if(saleError)throw saleError;


/* CREATE SALE ITEMS */

const saleItems=
items.map(item=>({

sale_id:sale.id,

product_id:item.productId,

product_name:item.productName,

barcode:item.barcode,

quantity:item.quantity,

unit_price:item.unitPrice,

cost_price:item.costPrice,

total:item.total

}));

const {error:itemError}=

await supabaseClient
.from("sale_items")
.insert(saleItems);

if(itemError)throw itemError;


/* UPDATE STOCK */

for(const item of items){

const product=
products.find(
p=>p.id===item.productId
);

const newStock=
Number(product.stock)-item.quantity;

const {error:stockError}=

await supabaseClient
.from("products")
.update({
stock:newStock,
updated_at:new Date().toISOString()
})
.eq("id",item.productId)
.eq("business_id",currentBusiness.id);

if(stockError)throw stockError;

}


/* AUDIT LOG */

await supabaseClient
.from("audit_logs")
.insert({

business_id:currentBusiness.id,

user_id:currentUser.id,

action:"CREATE_SALE",

table_name:"sales",

record_id:sale.id,

details:{
invoice:sale.invoice_number,
total:sale.total
}

});


await loadProducts();

await loadSales();

closeModal();

render();

alert(
"Sale completed successfully."
);

}catch(error){

console.error(error);

alert(
"Sale could not be completed:\n\n"+
error.message
);

}finally{

showLoading(false);

}

}

);

return`

</strong>

</p>

}).join("");

}

/* =========================================================
   DOWNLOAD BACKUP
   ========================================================= */

async function downloadBackup(){

showLoading(true);

try{

const backup={

version:"SalesPro V4",

created_at:
new Date().toISOString(),

business:currentBusiness,

profile:currentProfile,

products,

customers,

sales,

expenses

};

const blob=
new Blob(
[JSON.stringify(backup,null,2)],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"SalesPro_Backup_"+
today()+
".json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

alert(
"Backup created. On your iPhone, save the downloaded file to the Files app."
);

}catch(error){

alert(error.message);

}finally{

showLoading(false);

}

}


/* =========================================================
   RESTORE BACKUP
   ========================================================= */

function restoreBackup(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=async function(){

try{

const backup=
JSON.parse(reader.result);

if(!backup.products||
!backup.customers||
!backup.sales){

throw new Error(
"Invalid SalesPro backup."
);

}

if(!confirm(
"Restore this backup? This will add the backup records to the current system."
))return;

showLoading(true);


/*
Products
*/

for(const p of backup.products){

const productData={

business_id:currentBusiness.id,

name:p.name,

barcode:p.barcode||"",

category:p.category||"",

brand:p.brand||"",

unit:p.unit||"piece",

cost_price:Number(p.cost_price||0),

retail_price:Number(p.retail_price||0),

wholesale_price:Number(p.wholesale_price||0),

stock:Number(p.stock||0),

low_stock_level:Number(p.low_stock_level||5),

active:true

};

await supabaseClient
.from("products")
.upsert(
productData,
{
onConflict:"id"
}
);

}


/*
Customers
*/

for(const c of backup.customers){

await supabaseClient
.from("customers")
.upsert({

id:c.id,

business_id:currentBusiness.id,

name:c.name,

phone:c.phone||"",

email:c.email||"",

address:c.address||"",

customer_type:c.customer_type||"Retail",

balance:Number(c.balance||0)

});

}


/*
Local expenses
*/

if(backup.expenses){

expenses=backup.expenses;

saveExpensesLocal();

}


await loadProducts();

await loadCustomers();

await loadSales();

render();

alert(
"Backup restoration completed."
);

}catch(error){

console.error(error);

alert(
"Could not restore backup:\n\n"+
error.message
);

}finally{

showLoading(false);

}

};

reader.readAsText(file);

event.target.value="";

}

/* =========================================================
   BARCODE SCANNER
   ========================================================= */

let scannerTarget=null;


function scanForInput(inputId){

scannerTarget=inputId;

openScanner();

}


function openScanner(){

document.getElementById("scannerModal")
.classList.add("show");

document.getElementById("scanResult").textContent=
"Starting camera...";

setTimeout(startScanner,300);

}


async function startScanner(){

if(scannerRunning)return;

try{

scanner=
new Html5Qrcode("reader");

await scanner.start(

{
facingMode:"environment"
},

{
fps:10,

qrbox:{
width:280,
height:120
},

formatsToSupport:[

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.ITF

]

},

(decodedText)=>{

document.getElementById("scanResult")
.textContent=
"✅ "+decodedText;

if(scannerTarget){

const input=
document.getElementById(scannerTarget);

if(input){

input.value=decodedText;

input.dispatchEvent(
new Event(
"input",
{bubbles:true}
)
);

}

}

setTimeout(
closeScanner,
500
);

},

(errorMessage)=>{

/* Normal scan errors are ignored */

}

);

scannerRunning=true;

document.getElementById("scanResult")
.textContent=
"📷 Camera ready — scan barcode.";

}catch(error){

console.error(error);

document.getElementById("scanResult")
.innerHTML=
"❌ Camera could not start.<br><br>"+
"Please allow camera access in Safari.";

}

}


async function closeScanner(){

if(scanner){

try{

if(scannerRunning){

await scanner.stop();

}

}catch(error){

console.log(error);

}

try{

scanner.clear();

}catch(error){}

}

scanner=null;

scannerRunning=false;

scannerTarget=null;

document.getElementById("reader").innerHTML="";

document.getElementById("scannerModal")
.classList.remove("show");

}

async function initialise(){

try{

const {
data:{session}
}=await supabaseClient.auth.getSession();

if(session){

await loadApplication();

}else{

showLogin();

}

}catch(error){

console.error(error);

showLogin();

}finally{

showLoading(false);

}

}


/* =========================================================
   AUTH STATE LISTENER
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

if(event==="SIGNED_OUT"){

showLogin();

return;

}

if(
event==="SIGNED_IN" &&
session &&
!currentUser
){

currentUser=session.user;

await loadApplication();

}

}
);


/* =========================================================
   START
   ========================================================= */

initialise();
