"https://olkugewqersskavvcrhm.supabase.co";

/* =========================================================
HELPERS
========================================================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function money(value){

return "₦"+Number(value||0).toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}

function today(){

return new Date().toISOString().slice(0,10);

}

function daysUntil(date){

if(!date)return null;

const now=new Date();
now.setHours(0,0,0,0);

const target=new Date(date+"T00:00:00");

return Math.ceil(
(target-now)/(1000*60*60*24)
);

}

function isExpired(date){

const d=daysUntil(date);

return d!==null && d<0;

}

function isExpiringSoon(product){

if(!product.expiry_date)return false;

const d=daysUntil(product.expiry_date);
const alertDays=Number(product.expiry_alert_days||30);

return d>=0 && d<=alertDays;

}

async function checkAuth(){

const {
data:{session}
}=await supabaseClient.auth.getSession();

if(!session){

showLogin();
return;

}

currentUser=session.user;

await loadUserProfile();

}


async function loadUserProfile(){

const {
data:profile,
error
}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(error){

console.error(error);

showError(
"Unable to load your SalesPro profile: "+error.message
);

return;

}

if(!profile){

showError(
"Your login exists, but your SalesPro owner profile is missing. Please contact the system administrator."
);

return;

}

currentProfile=profile;

const {
data:business,
error:businessError
}=await supabaseClient
.from("businesses")
.select("*")
.eq("id",profile.business_id)
.maybeSingle();

if(businessError){

currentBusiness=business;

/* =========================================================
REGISTER
========================================================= */

async function registerOwner(){

const name=document.getElementById("regName").value.trim();
const email=document.getElementById("regEmail").value.trim();
const password=document.getElementById("regPassword").value;

const businessName=
document.getElementById("regBusiness").value.trim();

const phone=
document.getElementById("regPhone").value.trim();

const businessEmail=
document.getElementById("regBusinessEmail").value.trim();

const address=
document.getElementById("regAddress").value.trim();

if(!name||!email||!password||!businessName){

authMessage(
"Please complete all required fields."
);

return;

}

if(password.length<6){

authMessage(
"Password must contain at least 6 characters."
);

return;

}

try{

authMessage(
"Creating your account...",
"success"
);

const {
data,
error
}=await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name
}
}

});

if(error)throw error;

if(!data.user){

throw new Error(
"Account could not be created."
);

}

if(data.session){

const businessId=crypto.randomUUID();

const {
error:businessError
}=await supabaseClient
.from("businesses")
.insert({

id:businessId,
name:businessName,
phone:phone,
email:businessEmail||email,
address:address,
logo_url:""

});

if(businessError){

authMessage(
"Account created, but business profile failed: "+
businessError.message
);

return;

}

const {
error:profileError
}=await supabaseClient
.from("profiles")
.upsert({

id:data.user.id,
full_name:name,
role:"owner",
business_id:businessId,
active:true

},{
onConflict:"id"
});

if(profileError){

authMessage(
"Account created, but owner profile failed: "+
profileError.message
);

return;

}

authMessage(
"Account created successfully.",
"success"
);

setTimeout(showLogin,1500);

return;

}

authMessage(
"Account created successfully. Please check your email and verify your account before logging in.",
"success"
);

}catch(error){

console.error(error);

authMessage(
error.message||"Registration failed."
);

}

}

function openBarcodeForField(fieldId){

function barcodeStatus(message){

const box=document.getElementById("barcodeStatus");

if(box)box.innerHTML=message;

}


async function openBarcodeScanner(){

await stopBarcodeScanner();

document
.getElementById("barcodeModal")
.classList.add("show");

barcodeStatus("📷 Preparing camera...");

setTimeout(startBarcodeScanner,400);

}


async function startBarcodeScanner(){

if(barcodeStarting||barcodeRunning)return;

barcodeStarting=true;

await stopBarcodeScanner();

const reader=document.getElementById("barcodeReader");

reader.innerHTML="";

try{

barcodeScanner=
new Html5Qrcode("barcodeReader");

const formats=[

Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.ITF

];

const config={

fps:10,

qrbox:function(width,height){

return{

width:Math.min(300,Math.floor(width*.82)),

height:Math.min(160,Math.floor(height*.35))

};

},

aspectRatio:1.5,

formatsToSupport:formats

};

await barcodeScanner.start(

{facingMode:"environment"},

config,

function(code){

handleScannedBarcode(code);

},

function(){}

);

barcodeRunning=true;

barcodeStatus(
"📷 Camera ready — point it at the barcode."
);

}catch(error){

console.error(error);

barcodeStatus(
"⚠️ Live camera could not start.<br><br>"+
"Use <strong>Take Barcode Photo</strong> "+
"or enter the barcode manually."
);

}finally{

barcodeStarting=false;

}

}


function handleScannedBarcode(code){

code=String(code||"").trim();

if(!code)return;

const input=document.getElementById(barcodeTargetId);

if(input){

input.value=code;

input.dispatchEvent(
new Event("input",{bubbles:true})
);

input.dispatchEvent(
new Event("change",{bubbles:true})
);

}

barcodeStatus(
"✅ Barcode captured: <strong>"+
esc(code)+
"</strong>"
);

stopBarcodeScanner();

setTimeout(closeBarcodeScanner,700);

}


async function scanBarcodePhoto(event){

const file=event.target.files?.[0];

if(!file)return;

barcodeStatus(
"🔎 Reading barcode from photo..."
);

await stopBarcodeScanner();

try{

const scanner=
new Html5Qrcode("barcodeReader");

const result=
await scanner.scanFile(file,true);

try{
await scanner.clear();
}catch(e){}

handleScannedBarcode(result);

}catch(error){

console.error(error);

barcodeStatus(
"❌ Barcode could not be read from this photo.<br><br>"+
"Take a clear, well-lit photo with the barcode straight."
);

}

event.target.value="";

}


function useManualBarcode(){

const code=
document.getElementById("manualBarcode").value.trim();

if(!code){

alert("Enter a barcode first.");
return;

}

handleScannedBarcode(code);

}


async function stopBarcodeScanner(){

if(!barcodeScanner){

barcodeRunning=false;
return;

}

const old=barcodeScanner;

barcodeScanner=null;

try{

if(barcodeRunning)
await old.stop();

}catch(e){}

try{

await old.clear();

}catch(e){}

barcodeRunning=false;

}


async function closeBarcodeScanner(){

await stopBarcodeScanner();

document
.getElementById("barcodeModal")
.classList.remove("show");

document
.getElementById("barcodeReader")
.innerHTML="";

}

function refreshSaleRows(){

document.getElementById("saleType")?.value||
"Retail";

.querySelectorAll(".saleItem")
.forEach(row=>{

const productId=
row.querySelector(".saleProduct").value;

const qty=
Number(
row.querySelector(".saleQty").value||0
);

const product=
salesProducts.find(
p=>p.id===productId
);

row.querySelector(".saleItemPrice span");

row.querySelector(".stockBox");

if(!product){

priceBox.textContent="₦0.00";

"Select a product to see available stock.";

return;

}

let price=0;
let pieces=qty;
let label="piece";

if(type==="Retail"){

price=Number(product.retail_price||0);

pieces=qty;

label=
qty===1?
"piece":
"pieces";

}

else if(type==="Wholesale-Pack"){

price=Number(product.wholesale_price||0);

pieces=
qty*
Number(product.pieces_per_pack||1);

label=
qty===1?
"pack":
"packs";

}

else if(type==="Wholesale-Carton"){

price=Number(product.wholesale_price||0);

pieces=
qty*
Number(product.pieces_per_pack||1)*
Number(product.packs_per_carton||1);

label=
qty===1?
"carton":
"cartons";

}

const lineTotal=price*qty;

total+=lineTotal;

priceBox.textContent=
money(price)+" / "+label;

stockBox.innerHTML=`

Available stock:
<strong>
${Number(product.stock||0).toLocaleString()} pieces
</strong>

This sale will deduct:
<strong>
${pieces.toLocaleString()} pieces
</strong>

stockBox.classList.add("bad");

}else{

stockBox.classList.remove("bad");

}

});

document.getElementById("saleTotal");

if(totalBox)
totalBox.textContent=money(total);

}

async function completeSale(){

const type=
document.getElementById("saleType").value;

const rows=
document.querySelectorAll(".saleItem");

const items=[];

let total=0;

for(const row of rows){

const productId=
row.querySelector(".saleProduct").value;

const quantity=
Number(
row.querySelector(".saleQty").value||0
);

if(!productId||quantity<=0)continue;

const product=
salesProducts.find(
p=>p.id===productId
);

if(!product)continue;

let piecesDeducted=quantity;

let unitPrice=0;

let sellingUnit="piece";

if(type==="Retail"){

unitPrice=
Number(product.retail_price||0);

piecesDeducted=quantity;

sellingUnit="piece";

}

else if(type==="Wholesale-Pack"){

unitPrice=
Number(product.wholesale_price||0);

piecesDeducted=
quantity*
Number(product.pieces_per_pack||1);

sellingUnit="pack";

}

else if(type==="Wholesale-Carton"){

unitPrice=
Number(product.wholesale_price||0);

piecesDeducted=
quantity*
Number(product.pieces_per_pack||1)*
Number(product.packs_per_carton||1);

sellingUnit="carton";

}

if(
piecesDeducted>
Number(product.stock||0)
){

alert(
"Not enough stock for "+
product.name+
".\n\nAvailable: "+
product.stock+
" pieces\nRequired: "+
piecesDeducted+
" pieces"
);

return;

}

const lineTotal=
unitPrice*quantity;

items.push({

product_id:product.id,

product_name:product.name,

barcode:product.barcode,

quantity:quantity,

unit_price:unitPrice,

cost_price:
Number(product.cost_price||0),

total:lineTotal,

pieces_deducted:piecesDeducted,

selling_unit:sellingUnit

});

total+=lineTotal;

}

if(!items.length){

alert("Add at least one product.");

return;

}

const customerId=
document.getElementById("saleCustomer").value||null;

const customer=
salesCustomers.find(
c=>c.id===customerId
);

const invoice=
"INV-"+Date.now();

const sale={

business_id:
currentProfile.business_id,

invoice_number:invoice,

customer_id:customerId,

user_id:currentUser.id,

sale_type:
type==="Retail"
?"Retail - Single Piece":
type==="Wholesale-Pack"
?"Wholesale - Pack":
"Wholesale - Carton",

subtotal:total,

discount:0,

total:total,

amount_paid:
document.getElementById("salePayment").value==="Credit"
?0:
total,

balance:
document.getElementById("salePayment").value==="Credit"
?total:
0,

payment_method:
document.getElementById("salePayment").value,

status:"completed",

sale_date:
document.getElementById("saleDate").value,

customer_name:
customer?.name||
"Walk-in Customer",

created_by:currentUser.id

};

try{

const {
data,
error
}=
await supabaseClient
.from("sales")
.insert(sale)
.select()
.single();

if(error)throw error;

const saleItems=
items.map(item=>({

sale_id:data.id,

product_id:item.product_id,

product_name:item.product_name,

barcode:item.barcode,

quantity:item.quantity,

unit_price:item.unit_price,

cost_price:item.cost_price,

total:item.total

}));

const {
error:itemError
}=
await supabaseClient
.from("sale_items")
.insert(saleItems);

if(itemError)throw itemError;


/*
UPDATE STOCK
*/

for(const item of items){

const product=
salesProducts.find(
p=>p.id===item.product_id
);

const newStock=
Number(product.stock||0)-
Number(item.pieces_deducted||0);

const {
error:stockError
}=
await supabaseClient
.from("products")
.update({

stock:newStock,

updated_at:
new Date().toISOString()

})
.eq("id",item.product_id)
.eq("business_id",currentProfile.business_id);

if(stockError){

console.error(stockError);

}

}

closeModal();

await render();

alert(
"✅ Sale completed successfully.\n\n"+
"Invoice: "+invoice
);

}catch(error){

console.error(error);

alert(
"Sale could not be completed:\n"+
error.message
);

}

}

<h1>Backup & Data Protection</h1>

SalesPro can export your business data as a backup

📥 Export Backup
</button>

class="secondary"
onclick="document.getElementById('restoreFile').click()">
📤 Restore Backup
</button>

id="restoreFile"
type="file"
accept=".json"
style="display:none"
onchange="restoreBackup(event)">

</div>

<p>
<strong>
Always export a backup before replacing or updating
your SalesPro HTML.
</strong>
</p>

`;

async function downloadBackup(){

const products=await getProducts();
const sales=await getSales();
const customers=await getCustomers();
const expenses=await getExpenses();

const backup={

version:"SalesPro Backup V2",

created_at:new Date().toISOString(),

business:currentBusiness,

products,
sales,
customers,
expenses

};

const blob=new Blob(
[
JSON.stringify(backup,null,2)
],
{
type:"application/json"
}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=
"SalesPro_Backup_"+
today()+
".json";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

alert(
"✅ Backup created.\n\n"+
"On iPhone, choose 'Save to Files' and store it somewhere safe."
);

}


async function restoreBackup(event){

const file=event.target.files?.[0];

if(!file)return;

try{

const text=await file.text();

const backup=JSON.parse(text);

if(
!backup.products||
!backup.sales||
!backup.customers
){

throw new Error("Invalid backup");

}

alert(
"Backup file verified successfully.\n\n"+
"Automatic cloud restoration is disabled in this version "+
"to prevent duplicate sales and stock records."
);

}catch(error){

alert("Invalid SalesPro backup file.");

}

event.target.value="";

}
