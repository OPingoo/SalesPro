<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SalesPro">
<meta name="theme-color" content="#0b2a52">

<title>SalesPro - KC Integrated Global Services</title>

<style>
:root{
--navy:#0b2a52;
--blue:#155fa0;
--gold:#c6a15b;
--bg:#f4f6f9;
--white:#fff;
--text:#172033;
--muted:#667085;
--green:#087443;
--red:#b42318;
--border:#e2e6ec;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select,textarea{font:inherit}

button{
border:0;
border-radius:11px;
padding:11px 15px;
font-weight:700;
background:var(--navy);
color:white;
cursor:pointer;
}

button.secondary{
background:#e8edf3;
color:var(--navy);
}

button.green{background:var(--green)}
button.red{background:#fee4e2;color:var(--red)}

.header{
position:sticky;
top:0;
z-index:20;
background:white;
border-bottom:1px solid var(--border);
}

.brand{
display:flex;
align-items:center;
gap:12px;
padding:10px 14px;
}

.logo{
width:52px;
height:52px;
border-radius:12px;
background:white;
}

.brand strong{
font-size:18px;
display:block;
}

.brand small{
color:var(--muted);
}

.nav{
display:flex;
overflow-x:auto;
gap:7px;
padding:0 12px 10px;
}

.nav button{
white-space:nowrap;
background:#edf2f7;
color:var(--navy);
}

.nav button.active{
background:var(--navy);
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:15px 12px 100px;
}

h1{
font-size:25px;
margin:18px 0 13px;
}

h2{
font-size:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.card{
background:white;
border:1px solid var(--border);
border-radius:16px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.stat{
font-size:13px;
color:var(--muted);
}

.stat strong{
display:block;
font-size:23px;
color:var(--text);
margin-top:5px;
}

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:12px 0;
}

input,select,textarea{
width:100%;
border:1px solid #d0d5dd;
border-radius:10px;
padding:11px;
background:white;
outline:none;
}

textarea{
min-height:90px;
resize:vertical;
}

label{
font-size:12px;
font-weight:700;
color:var(--muted);
display:block;
margin:8px 0 5px;
}

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.full{
grid-column:1/-1;
}

.table{
overflow-x:auto;
background:white;
border:1px solid var(--border);
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

th,td{
padding:11px;
border-bottom:1px solid #edf0f3;
text-align:left;
}

th{
font-size:12px;
background:#f8fafc;
}

.money{
font-weight:800;
}

.good{color:var(--green)}
.bad{color:var(--red)}

.empty{
padding:35px;
text-align:center;
color:var(--muted);
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:100;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.sheet{
background:white;
width:100%;
max-height:94vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px;
}

.actions{
display:flex;
gap:8px;
justify-content:flex-end;
flex-wrap:wrap;
margin-top:15px;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#edf2f7;
font-size:12px;
}

.footer{
text-align:center;
color:var(--muted);
padding:30px 10px;
font-size:12px;
}

@media(max-width:700px){
.grid{
grid-template-columns:repeat(2,1fr);
}
.formgrid{
grid-template-columns:1fr;
}
.full{
grid-column:auto;
}
}

@media print{
.header,.toolbar,.noPrint{
display:none!important;
}
.container{
padding:0;
}
.card{
box-shadow:none;
}
}
</style>
</head>

<body>

<header class="header">

<div class="brand">

<!-- KC INTEGRATED GLOBAL SERVICES LOGO -->
<svg class="logo" viewBox="0 0 100 100">
<rect width="100" height="100" fill="white"/>
<path d="M18 75V52l10-7v30H18z" fill="#123c70"/>
<path d="M34 75V32l10-7v50H34z" fill="#123c70"/>
<path d="M50 75V18l10-8v65H50z" fill="#123c70"/>
<path d="M55 49l20-20h15L68 50l22 25H75L55 56z" fill="#123c70"/>
<path d="M79 29c11 1 18 9 18 20 0 10-7 19-17 21 7-3 11-9 11-17 0-10-7-18-18-19z" fill="#7b8188"/>
</svg>

<div>
<strong>SalesPro</strong>
<small>KC Integrated Global Services</small>
</div>

</div>

<nav class="nav" id="nav"></nav>

</header>

<main class="container" id="app"></main>

<div class="modal" id="modal">
<div class="sheet" id="sheet"></div>
</div>

<script>

/* =====================================================
   SALESPRO V3
   KC INTEGRATED GLOBAL SERVICES
   ===================================================== */

const DBKEY="SALESPRO_KCIS_V3_DATABASE";

let db=JSON.parse(localStorage.getItem(DBKEY)||"null");

if(!db){
db={
products:[],
sales:[],
customers:[],
expenses:[],
settings:{
business:"KC Integrated Global Services",
currency:"₦"
}
};
save();
}

function save(){
localStorage.setItem(DBKEY,JSON.stringify(db));
}

function money(n){
return db.settings.currency+
Number(n||0).toLocaleString("en-NG",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function id(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function today(){
return new Date().toISOString().slice(0,10);
}

const navItems=[
["dashboard","Dashboard"],
["sales","Sales"],
["products","Products"],
["customers","Customers"],
["expenses","Expenses"],
["reports","Reports"],
["backup","Backup"],
["settings","Settings"]
];

let page="dashboard";

function renderNav(){
document.getElementById("nav").innerHTML=
navItems.map(x=>
`<button class="${page==x[0]?"active":""}" onclick="go('${x[0]}')">
${x[1]}
</button>`).join("");
}

function go(p){
page=p;
renderNav();
render();
window.scrollTo(0,0);
}

function render(){
const app=document.getElementById("app");

if(page==="dashboard")app.innerHTML=dashboard();
if(page==="sales")app.innerHTML=salesPage();
if(page==="products")app.innerHTML=productsPage();
if(page==="customers")app.innerHTML=customersPage();
if(page==="expenses")app.innerHTML=expensesPage();
if(page==="reports")app.innerHTML=reportsPage();
if(page==="backup")app.innerHTML=backupPage();
if(page==="settings")app.innerHTML=settingsPage();
}

/* ================= DASHBOARD ================= */

function dashboard(){

let revenue=db.sales.reduce((a,b)=>a+Number(b.total),0);

let cost=db.sales.reduce((a,b)=>a+
(b.items||[]).reduce((x,i)=>
x+Number(i.qty)*Number(i.cost||0),0),0);

let expenses=db.expenses.reduce((a,b)=>a+Number(b.amount),0);

let profit=revenue-cost-expenses;

let stockValue=db.products.reduce((a,b)=>
a+Number(b.stock)*Number(b.cost||0),0);

return`

<h1>Dashboard</h1>

<div class="grid">

<div class="card stat">
Total Sales
<strong>${money(revenue)}</strong>
</div>

<div class="card stat">
Gross Profit
<strong class="${profit>=0?"good":"bad"}">${money(profit)}</strong>
</div>

<div class="card stat">
Products
<strong>${db.products.length}</strong>
</div>

<div class="card stat">
Stock Value
<strong>${money(stockValue)}</strong>
</div>

</div>

<div class="toolbar">
<button onclick="newSale()">+ New Sale</button>
<button class="secondary" onclick="newProduct()">+ Add Product</button>
<button class="secondary" onclick="newCustomer()">+ Customer</button>
</div>

<div class="card">
<h2>Recent Sales</h2>
${recentSales()}
</div>

<div class="footer">
SalesPro V3 • ${db.settings.business}
</div>
`;
}

function recentSales(){

let rows=db.sales.slice().reverse().slice(0,8);

if(!rows.length)
return `<div class="empty">No sales recorded yet.</div>`;

return `<div class="table">
<table>
<tr>
<th>Date</th>
<th>Customer</th>
<th>Type</th>
<th>Total</th>
</tr>
${rows.map(s=>`
<tr>
<td>${s.date}</td>
<td>${s.customer||"Walk-in Customer"}</td>
<td><span class="badge">${s.type}</span></td>
<td class="money">${money(s.total)}</td>
</tr>`).join("")}
</table>
</div>`;
}

/* ================= PRODUCTS ================= */

function productsPage(){

return`

<h1>Products & Inventory</h1>

<div class="toolbar">
<button onclick="newProduct()">+ Add Product</button>
<input style="max-width:300px" id="productSearch"
placeholder="Search product..." oninput="filterProducts()">
</div>

<div class="table" id="productTable">
${productTable()}
</div>
`;
}

function productTable(filter=""){

let list=db.products.filter(p=>
p.name.toLowerCase().includes(filter.toLowerCase())
);

if(!list.length)
return `<div class="empty">No products found.</div>`;

return`
<table>
<tr>
<th>Product</th>
<th>SKU</th>
<th>Retail</th>
<th>Wholesale</th>
<th>Cost</th>
<th>Stock</th>
<th>Action</th>
</tr>

${list.map(p=>`
<tr>
<td><strong>${esc(p.name)}</strong></td>
<td>${esc(p.sku||"-")}</td>
<td>${money(p.retail)}</td>
<td>${money(p.wholesale)}</td>
<td>${money(p.cost)}</td>
<td class="${Number(p.stock)<=Number(p.low||0)?"bad":""}">
${p.stock}
</td>
<td>
<button class="secondary" onclick="editProduct('${p.id}')">Edit</button>
</td>
</tr>
`).join("")}

</table>`;
}

function filterProducts(){
document.getElementById("productTable").innerHTML=
productTable(document.getElementById("productSearch").value);
}

function newProduct(product=null){

openModal(`
<h2>${product?"Edit":"Add"} Product</h2>

<div class="formgrid">

<div class="full">
<label>Product Name</label>
<input id="pname" value="${esc(product?.name||"")}">
</div>

<div>
<label>SKU / Code</label>
<input id="psku" value="${esc(product?.sku||"")}">
</div>

<div>
<label>Category</label>
<input id="pcat" value="${esc(product?.category||"")}">
</div>

<div>
<label>Cost Price</label>
<input id="pcost" type="number" value="${product?.cost||0}">
</div>

<div>
<label>Retail Price</label>
<input id="pretail" type="number" value="${product?.retail||0}">
</div>

<div>
<label>Wholesale Price</label>
<input id="pwhole" type="number" value="${product?.wholesale||0}">
</div>

<div>
<label>Opening Stock</label>
<input id="pstock" type="number" value="${product?.stock||0}">
</div>

<div>
<label>Low Stock Alert</label>
<input id="plow" type="number" value="${product?.low||5}">
</div>

</div>

<div class="actions">

<button class="secondary" onclick="closeModal()">Cancel</button>

<button onclick="saveProduct('${product?.id||""}')">
Save Product
</button>

${product?
`<button class="red" onclick="deleteProduct('${product.id}')">
Delete
</button>`:""}

</div>
`);
}

function saveProduct(existing){

let p={
id:existing||id(),
name:document.getElementById("pname").value.trim(),
sku:document.getElementById("psku").value.trim(),
category:document.getElementById("pcat").value.trim(),
cost:Number(document.getElementById("pcost").value),
retail:Number(document.getElementById("pretail").value),
wholesale:Number(document.getElementById("pwhole").value),
stock:Number(document.getElementById("pstock").value),
low:Number(document.getElementById("plow").value)
};

if(!p.name)return alert("Enter product name.");

let index=db.products.findIndex(x=>x.id===p.id);

if(index>=0)db.products[index]=p;
else db.products.push(p);

save();
closeModal();
render();
}

function editProduct(id){
let p=db.products.find(x=>x.id===id);
if(p)newProduct(p);
}

function deleteProduct(id){

if(!confirm("Delete this product?"))return;

db.products=db.products.filter(x=>x.id!==id);
save();
closeModal();
render();
}

/* ================= SALES ================= */

function salesPage(){

return`

<h1>Sales</h1>

<div class="toolbar">
<button onclick="newSale()">+ New Sale</button>
</div>

${salesTable()}
`;
}

function salesTable(){

if(!db.sales.length)
return `<div class="card empty">No sales recorded.</div>`;

return`
<div class="table">
<table>
<tr>
<th>Date</th>
<th>Invoice</th>
<th>Customer</th>
<th>Type</th>
<th>Payment</th>
<th>Total</th>
</tr>

${db.sales.slice().reverse().map(s=>`
<tr>
<td>${s.date}</td>
<td>${s.invoice}</td>
<td>${esc(s.customer||"Walk-in")}</td>
<td>${s.type}</td>
<td>${s.payment}</td>
<td class="money">${money(s.total)}</td>
</tr>
`).join("")}

</table>
</div>`;
}

function newSale(){

if(!db.products.length){
alert("Please add products first.");
go("products");
return;
}

let rows=[];

openModal(`
<h2>New Sale</h2>

<div class="formgrid">

<div>
<label>Customer</label>
<select id="saleCustomer">
<option value="">Walk-in Customer</option>
${db.customers.map(c=>
`<option>${esc(c.name)}</option>`).join("")}
</select>
</div>

<div>
<label>Sale Type</label>
<select id="saleType" onchange="updateSalePrices()">
<option>Retail</option>
<option>Wholesale</option>
</select>
</div>

<div>
<label>Payment</label>
<select id="salePayment">
<option>Cash</option>
<option>Transfer</option>
<option>POS</option>
<option>Credit</option>
</select>
</div>

<div>
<label>Date</label>
<input id="saleDate" type="date" value="${today()}">
</div>

</div>

<hr>

<div id="saleItems"></div>

<button class="secondary" onclick="addSaleRow()">+ Add Item</button>

<div class="card" style="margin-top:15px">
<strong>Total: <span id="saleTotal">${money(0)}</span></strong>
</div>

<div class="actions">
<button class="secondary" onclick="closeModal()">Cancel</button>
<button onclick="completeSale()">Complete Sale</button>
</div>
`);

addSaleRow();
}

function addSaleRow(){

let box=document.getElementById("saleItems");

let div=document.createElement("div");

div.className="card";

div.style.marginBottom="10px";

div.innerHTML=`

<div class="formgrid">

<div>
<label>Product</label>
<select class="sproduct" onchange="updateSaleTotal()">
<option value="">Select product</option>
${db.products.map(p=>
`<option value="${p.id}">
${esc(p.name)} — Stock ${p.stock}
</option>`).join("")}
</select>
</div>

<div>
<label>Quantity</label>
<input class="sqty" type="number" min="1" value="1"
oninput="updateSaleTotal()">
</div>

</div>

<div class="rowprice">
Price: <strong class="sprice">${money(0)}</strong>
</div>
`;

box.appendChild(div);

}

function updateSalePrices(){
updateSaleTotal();
}

function updateSaleTotal(){

let total=0;

document.querySelectorAll("#saleItems .card").forEach(row=>{

let pid=row.querySelector(".sproduct").value;
let qty=Number(row.querySelector(".sqty").value||0);

let p=db.products.find(x=>x.id===pid);

let type=document.getElementById("saleType")?.value||"Retail";

let price=p?(type==="Wholesale"?p.wholesale:p.retail):0;

row.querySelector(".sprice").textContent=money(price);

total+=price*qty;
});

let t=document.getElementById("saleTotal");

if(t)t.textContent=money(total);
}

function completeSale(){

let items=[];
let total=0;

document.querySelectorAll("#saleItems .card").forEach(row=>{

let pid=row.querySelector(".sproduct").value;
let qty=Number(row.querySelector(".sqty").value||0);

let p=db.products.find(x=>x.id===pid);

if(!p||qty<=0)return;

let type=document.getElementById("saleType").value;
let price=type==="Wholesale"?Number(p.wholesale):Number(p.retail);

if(qty>Number(p.stock)){
alert("Not enough stock for "+p.name);
throw new Error("Stock");
}

items.push({
productId:p.id,
name:p.name,
qty,
price,
cost:p.cost
});

total+=qty*price;
});

if(!items.length){
alert("Add at least one product.");
return;
}

items.forEach(i=>{
let p=db.products.find(x=>x.id===i.productId);
p.stock-=i.qty;
});

let sale={
id:id(),
invoice:"INV-"+Date.now(),
date:document.getElementById("saleDate").value,
customer:document.getElementById("saleCustomer").value,
type:document.getElementById("saleType").value,
payment:document.getElementById("salePayment").value,
items,
total
};

db.sales.push(sale);

save();
closeModal();
render();
}

/* ================= CUSTOMERS ================= */

function customersPage(){

return`

<h1>Customers</h1>

<div class="toolbar">
<button onclick="newCustomer()">+ Add Customer</button>
</div>

${db.customers.length?
`<div class="table">
<table>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Address</th>
<th>Credit</th>
<th>Action</th>
</tr>

${db.customers.map(c=>`
<tr>
<td>${esc(c.name)}</td>
<td>${esc(c.phone||"-")}</td>
<td>${esc(c.address||"-")}</td>
<td>${money(c.credit||0)}</td>
<td>
<button class="secondary" onclick="editCustomer('${c.id}')">
Edit
</button>
</td>
</tr>
`).join("")}

</table>
</div>`
:
`<div class="card empty">No customers yet.</div>`}
`;
}

function newCustomer(c=null){

openModal(`
<h2>${c?"Edit":"Add"} Customer</h2>

<label>Name</label>
<input id="cname" value="${esc(c?.name||"")}">

<label>Phone</label>
<input id="cphone" value="${esc(c?.phone||"")}">

<label>Address</label>
<textarea id="caddress">${esc(c?.address||"")}</textarea>

<label>Opening Credit</label>
<input id="ccredit" type="number" value="${c?.credit||0}">

<div class="actions">
<button class="secondary" onclick="closeModal()">Cancel</button>
<button onclick="saveCustomer('${c?.id||""}')">Save</button>
${c?`<button class="red" onclick="deleteCustomer('${c.id}')">Delete</button>`:""}
</div>
`);
}

function saveCustomer(existing){

let c={
id:existing||id(),
name:document.getElementById("cname").value.trim(),
phone:document.getElementById("cphone").value.trim(),
address:document.getElementById("caddress").value.trim(),
credit:Number(document.getElementById("ccredit").value||0)
};

if(!c.name)return alert("Enter customer name.");

let i=db.customers.findIndex(x=>x.id===c.id);

if(i>=0)db.customers[i]=c;
else db.customers.push(c);

save();
closeModal();
render();
}

function editCustomer(id){
let c=db.customers.find(x=>x.id===id);
if(c)newCustomer(c);
}

function deleteCustomer(id){

if(!confirm("Delete customer?"))return;

db.customers=db.customers.filter(x=>x.id!==id);
save();
closeModal();
render();
}

/* ================= EXPENSES ================= */

function expensesPage(){

let total=db.expenses.reduce((a,b)=>a+Number(b.amount),0);

return`

<h1>Expenses</h1>

<div class="grid">

<div class="card stat">
Total Expenses
<strong>${money(total)}</strong>
</div>

</div>

<div class="toolbar">
<button onclick="newExpense()">+ Add Expense</button>
</div>

${db.expenses.length?
`<div class="table">
<table>
<tr>
<th>Date</th>
<th>Description</th>
<th>Category</th>
<th>Amount</th>
<th>Action</th>
</tr>

${db.expenses.slice().reverse().map(e=>`
<tr>
<td>${e.date}</td>
<td>${esc(e.description)}</td>
<td>${esc(e.category)}</td>
<td>${money(e.amount)}</td>
<td>
<button class="red" onclick="deleteExpense('${e.id}')">
Delete
</button>
</td>
</tr>
`).join("")}

</table>
</div>`
:
`<div class="card empty">No expenses recorded.</div>`}
`;
}

function newExpense(){

openModal(`
<h2>Add Expense</h2>

<label>Date</label>
<input id="edate" type="date" value="${today()}">

<label>Description</label>
<input id="edesc">

<label>Category</label>
<select id="ecat">
<option>Transport</option>
<option>Rent</option>
<option>Electricity</option>
<option>Salary</option>
<option>Shopping</option>
<option>Maintenance</option>
<option>Other</option>
</select>

<label>Amount</label>
<input id="eamount" type="number">

<div class="actions">
<button class="secondary" onclick="closeModal()">Cancel</button>
<button onclick="saveExpense()">Save Expense</button>
</div>
`);
}

function saveExpense(){

let e={
id:id(),
date:document.getElementById("edate").value,
description:document.getElementById("edesc").value,
category:document.getElementById("ecat").value,
amount:Number(document.getElementById("eamount").value||0)
};

if(!e.description||!e.amount){
alert("Enter description and amount.");
return;
}

db.expenses.push(e);
save();
closeModal();
render();
}

function deleteExpense(id){

if(!confirm("Delete this expense?"))return;

db.expenses=db.expenses.filter(x=>x.id!==id);
save();
render();
}

/* ================= REPORTS ================= */

function reportsPage(){

let revenue=db.sales.reduce((a,b)=>a+Number(b.total),0);

let cost=db.sales.reduce((a,b)=>a+
(b.items||[]).reduce((x,i)=>
x+Number(i.qty)*Number(i.cost||0),0),0);

let expenses=db.expenses.reduce((a,b)=>a+Number(b.amount),0);

let gross=revenue-cost;

let net=gross-expenses;

return`

<h1>Reports</h1>

<div class="grid">

<div class="card stat">
Sales Revenue
<strong>${money(revenue)}</strong>
</div>

<div class="card stat">
Cost of Goods
<strong>${money(cost)}</strong>
</div>

<div class="card stat">
Gross Profit
<strong>${money(gross)}</strong>
</div>

<div class="card stat">
Net Profit
<strong class="${net>=0?"good":"bad"}">${money(net)}</strong>
</div>

</div>

<div class="toolbar noPrint">
<button onclick="window.print()">Print Report</button>
</div>

<div class="card">

<h2>Sales Summary</h2>

<p>Total Transactions: <strong>${db.sales.length}</strong></p>

<p>Total Products: <strong>${db.products.length}</strong></p>

<p>Total Customers: <strong>${db.customers.length}</strong></p>

<p>Total Expenses: <strong>${money(expenses)}</strong></p>

<hr>

<h2>Payment Breakdown</h2>

${paymentReport()}

</div>
`;
}

function paymentReport(){

let methods=["Cash","Transfer","POS","Credit"];

return methods.map(m=>{

let total=db.sales
.filter(s=>s.payment===m)
.reduce((a,b)=>a+Number(b.total),0);

return`
<p>
${m}: <strong>${money(total)}</strong>
</p>`;

}).join("");
}

/* ================= BACKUP ================= */

function backupPage(){

return`

<h1>Backup & Data Protection</h1>

<div class="card">

<h2>Protect your records</h2>

<p>
Your SalesPro records are stored locally on this device/browser.
Before any future upgrade, export a backup.
</p>

<div class="toolbar">
<button onclick="downloadBackup()">
Export Backup
</button>

<button class="secondary" onclick="document.getElementById('restoreFile').click()">
Restore Backup
</button>

<input id="restoreFile"
type="file"
accept=".json"
style="display:none"
onchange="restoreBackup(event)">
</div>

<hr>

<p>
Products: <strong>${db.products.length}</strong>
</p>

<p>
Sales: <strong>${db.sales.length}</strong>
</p>

<p>
Customers: <strong>${db.customers.length}</strong>
</p>

<p>
Expenses: <strong>${db.expenses.length}</strong>
</p>

</div>

<div class="card">

<h2>Important</h2>

<p>
When we upgrade SalesPro in the future, you should first use
<strong>Export Backup</strong>. After installing the new version,
use <strong>Restore Backup</strong>.
</p>

</div>
`;
}

function downloadBackup(){

let data=JSON.stringify(db,null,2);

let blob=new Blob([data],{
type:"application/json"
});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download=
"SalesPro_Backup_"+today()+".json";

a.click();

URL.revokeObjectURL(a.href);
}

function restoreBackup(event){

let file=event.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

try{

let restored=JSON.parse(reader.result);

if(!restored.products||
!restored.sales||
!restored.customers||
!restored.expenses){

throw new Error("Invalid backup");
}

if(!confirm("Restore this backup? Current data will be replaced."))return;

db=restored;

save();

alert("Backup restored successfully.");

render();

}catch(e){

alert("This is not a valid SalesPro backup.");

}

};

reader.readAsText(file);
}

function settingsPage(){

return`

<h1>Business Settings</h1>

<div class="card">

<label>Business Name</label>

<input id="businessName"
value="${esc(db.settings.business)}">

<label>Currency</label>

<input id="currency"
value="${esc(db.settings.currency)}">

<div class="actions">

<button onclick="saveSettings()">
Save Settings
</button>

</div>

</div>

<div class="card">

<h2>Data</h2>

<button class="red"
onclick="factoryReset()">
Delete All Data
</button>

</div>
`;
}

function saveSettings(){

db.settings.business=
document.getElementById("businessName").value;

db.settings.currency=
document.getElementById("currency").value||"₦";

save();

renderNav();
render();

alert("Settings saved.");
}

function factoryReset(){

let answer=prompt(
"Type DELETE to permanently erase all SalesPro records."
);

if(answer!=="DELETE")return;

db={
products:[],
sales:[],
customers:[],
expenses:[],
settings:{
business:"KC Integrated Global Services",
currency:"₦"
}
};

save();
render();
alert("All records deleted.");
}

/* ================= MODAL ================= */

function openModal(html){

document.getElementById("sheet").innerHTML=html;

document.getElementById("modal").classList.add("show");
}

function closeModal(){

document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener(
"click",
function(e){
if(e.target===this)closeModal();
}
);

/* ================= UTILITIES ================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* START APP */

renderNav();
render();

</script>
