/* =====================================================
HELPERS
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return "₦" +
Number(value || 0)
.toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function uid(){

return crypto.randomUUID();

}


function daysUntil(date){

if(!date)return null;

const a =
new Date();

const b =
new Date(date);

a.setHours(0,0,0,0);

b.setHours(0,0,0,0);

return Math.ceil(
(b-a)/(1000*60*60*24)
);

}


function expiryStatus(date){

const days =
daysUntil(date);

if(days === null)
return "";

if(days < 0)
return "expired";

if(days <= 30)
return "expiry";

return "";

}


function expiryLabel(date){

const days =
daysUntil(date);

if(days === null)
return "";

if(days < 0)
return "⚠️ EXPIRED";

if(days === 0)
return "⚠️ Expires today";

if(days <= 30)
return "⚠️ Expires in " + days + " days";

return "Expires " + date;

}

function openScannerFor(

){

function openScanner(){

document
.getElementById("scanner")
.classList.add("show");

document
.getElementById("scanStatus")
.innerHTML =
"📷 Preparing camera...";

setTimeout(
startScanner,
300
);

async function startScanner(){

if(scannerRunning)
return;


await stopScanner();


try{

scanner =
new Html5Qrcode(
"reader"
);


const formats = [

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.ITF

];


await scanner.start(

{
facingMode:"environment"
},

{
fps:10,

qrbox:{
width:280,
height:160
},

formatsToSupport:
formats

},

code=>{

handleScan(code);

},

()=>{}

);


scannerRunning=true;


document.getElementById(
"scanStatus"
).innerHTML =
"✅ Camera ready. Point the camera at the barcode.";

}catch(error){

console.error(error);

document.getElementById(
"scanStatus"
).innerHTML =
"⚠️ Camera could not start. Use barcode photo or enter it manually.";

}

}


function handleScan(code){

code =
String(code||"").trim();

if(!code)
return;


if(scanTarget){

const input =
document.getElementById(
scanTarget
);

if(input){

input.value=code;

input.dispatchEvent(
new Event(
"input",
{
bubbles:true
}
)
);

}

}


document.getElementById(
"scanStatus"
).innerHTML =
"✅ Barcode captured: <strong>"+
esc(code)+
"</strong>";


setTimeout(
closeScanner,
600
);

}


async function scanPhoto(event){

const file =
event.target.files?.[0];

if(!file)
return;


document.getElementById(
"scanStatus"
).innerHTML =
"🔎 Reading barcode from image...";


await stopScanner();


try{

const reader =
new Html5Qrcode(
"reader"
);


const result =
await reader.scanFile(
file,
true
);


try{
await reader.clear();
}catch(e){}


handleScan(result);


}catch(error){

console.error(error);

document.getElementById(
"scanStatus"
).innerHTML =
"❌ Barcode not detected. Take a clearer picture.";

}


event.target.value="";

}


function useManualScan(){

const code =
document.getElementById(
"scanManual"
).value.trim();


if(!code){

alert(
"Enter a barcode."
);

return;

}


handleScan(code);

}


async function stopScanner(){

if(!scanner){

scannerRunning=false;

return;

}


const s =
scanner;

scanner=null;


try{

if(scannerRunning){

await s.stop();

}

}catch(e){

console.log(e);

}


try{

await s.clear();

}catch(e){

console.log(e);

}


scannerRunning=false;

}


async function closeScanner(){

await stopScanner();

document
.getElementById("scanner")
.classList.remove("show");

}

/* =====================================================
SALE CALCULATION
===================================================== */

function getSalePrice(
product,
unit
){

if(!product)
return 0;


if(unit==="pack")
return Number(
product.pack_price||0
);


if(unit==="carton")
return Number(
product.carton_price||0
);


return Number(
product.retail_price||0
);


}


function piecesForSale(
product,
unit,
quantity
){

if(unit==="pack"){

return quantity *
Number(
product.pieces_per_pack||1
);

}


if(unit==="carton"){

return quantity *
Number(
product.pieces_per_pack||1
) *
Number(
product.packs_per_carton||1
);

}


return quantity;

}


function refreshSaleLines(){

const rows =
document.querySelectorAll(
".saleLine"
);


let gross=0;


rows.forEach(row=>{

const product =
saleProducts.find(
p=>
p.id ===
row.querySelector(
".saleProduct"
).value
);


const unit =
row.querySelector(
".saleUnit"
).value;


const qty =
Number(
row.querySelector(
".saleQty"
).value||0
);


if(!product){

row.querySelector(
".systemPrice"
).value =
money(0);

row.querySelector(
".salePrice"
).value=0;

row.querySelector(
".lineTotal"
).textContent =
money(0);

return;

}


const systemPrice =
getSalePrice(
product,
unit
);


const priceInput =
row.querySelector(
".salePrice"
);


if(
!priceInput.dataset.manual
){

priceInput.value =
systemPrice;

}


row.querySelector(
".systemPrice"
).value =
money(systemPrice);


const price =
Number(
priceInput.value||0
);


const itemDiscount =
Number(
row.querySelector(
".itemDiscount"
).value||0
);


const lineGross =
price*qty;


const lineTotal =
Math.max(
0,
lineGross-itemDiscount
);


gross += lineTotal;


row.querySelector(
".lineTotal"
).textContent =
money(lineTotal);


const pieces =
piecesForSale(
product,
unit,
qty
);


row.dataset.pieces =
pieces;

});


const discountType =
document.getElementById(
"discountType"
)?.value ||
"amount";


const overall =
Number(
document.getElementById(
"discount"
)?.value||0
);


const discount =
discountType==="percent"
?
gross*overall/100
:
overall;


const total =

/* =====================================================
COMPLETE SALE
===================================================== */

async function completeSale(){

const rows =
document.querySelectorAll(
".saleLine"
);


const saleType =
document.getElementById(
"saleType"
).value;


const items=[];

let gross=0;


for(const row of rows){

const productId =
row.querySelector(
".saleProduct"
).value;


const quantity =
Number(
row.querySelector(
".saleQty"
).value||0
);


const unit =
row.querySelector(
".saleUnit"
).value;


if(
!productId ||
quantity<=0
)
continue;


const product =
saleProducts.find(
p=>p.id===productId
);


if(!product)
continue;


const pieces =
piecesForSale(
product,
unit,
quantity
);


if(
pieces >
Number(product.stock||0)
){

alert(
`Not enough stock for ${product.name}.

Available:
${product.stock} pieces.

Required:
${pieces} pieces.`
);

return;

}


const price =
Number(
row.querySelector(
".salePrice"
).value||0
);


const itemDiscount =
Number(
row.querySelector(
".itemDiscount"
).value||0
);


const lineGross =
price*quantity;


const lineTotal =
Math.max(
0,
lineGross-itemDiscount
);


gross += lineTotal;


items.push({

product,

product_id:
product.id,

product_name:
product.name,

barcode:
product.barcode,

quantity,

selling_unit:
unit,

pieces_sold:
pieces,

unit_price:
price,

cost_price:
Number(
product.cost_price||0
),

discount:
itemDiscount,

discount_type:
"amount",

total:
lineTotal

});

}


if(!items.length){

alert(
"Add at least one product."
);

return;

}


const discountType =
document.getElementById(
"discountType"
).value;


const discountInput =
Number(
document.getElementById(
"discount"
).value||0
);


const overallDiscount =
discountType==="percent"
?
gross*discountInput/100
:
discountInput;


const finalTotal =
Math.max(
0,
gross-overallDiscount
);


const invoice =
"INV-" +
Date.now();


const customerId =
document.getElementById(
"saleCustomer"
).value ||
null;


const customer =
saleCustomers.find(
c=>c.id===customerId
);


const sale={

business_id:
profile.business_id,

invoice_number:
invoice,

customer_id:
customerId,

user_id:
user.id,

created_by:
user.id,

customer_name:
customer?.name ||
"Walk-in Customer",

sale_type:
saleType,

subtotal:
gross,

gross_total:
gross,

discount:
overallDiscount,

discount_type:
discountType,

total:
finalTotal,

amount_paid:
finalTotal,

balance:0,

payment_method:
document.getElementById(
"salePayment"
).value,

status:
"completed",

sale_date:
document.getElementById(
"saleDate"
).value

};


try{

/*
IMPORTANT:
Create sale first.
*/

const {
data:saleData,
error:saleError
} =
await sb
.from("sales")
.insert(sale)
.select()
.single();


if(saleError)
throw saleError;


/*
Insert items.
*/

const itemRows =
items.map(
item=>({

sale_id:
saleData.id,

product_id:
item.product_id,

product_name:
item.product_name,

barcode:
item.barcode,

quantity:
item.quantity,

selling_unit:
item.selling_unit,

pieces_sold:
item.pieces_sold,

unit_price:
item.unit_price,

cost_price:
item.cost_price,

discount:
item.discount,

discount_type:
item.discount_type,

total:
item.total

})
);


const {
error:itemError
} =
await sb
.from("sale_items")
.insert(itemRows);


if(itemError)
throw itemError;


/*
Atomic stock update.
*/

for(
const item of items
){

const {
data:newStock,
error:stockError
} =
await sb.rpc(
"process_salespro_sale",
{

p_business_id:
profile.business_id,

p_product_id:
item.product_id,

p_quantity:
item.pieces_sold

}
);


if(stockError){

throw stockError;

}

}


/*
Refresh cloud data.
*/

closeModal();

await render();


alert(
`Sale completed successfully.

Invoice:
${invoice}

Total:
${money(finalTotal)}`
);


}catch(error){

console.error(error);

alert(
"Sale could not be completed:\n\n"+
error.message
);

}

}

/* =====================================================
REALTIME CLOUD SYNCHRONIZATION
===================================================== */

function setupRealtime(){

cleanupRealtime();


const channel =
sb
.channel(
"salespro-business-"+profile.business_id
);


channel.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"products",
filter:
"business_id=eq."+
profile.business_id
},
payload=>{

if(page==="dashboard"||
page==="products"||
page==="sales"){

render();

}

}
);


channel.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"sales",
filter:
"business_id=eq."+
profile.business_id
},
payload=>{

if(page==="dashboard"||
page==="sales"||
page==="reports"){

render();

}

}
);


channel.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"stock_movements",
filter:
"business_id=eq."+
profile.business_id
},
payload=>{

if(page==="dashboard"||
page==="products"||
page==="sales"||
page==="reports"){

render();

}

}
);


channel.subscribe(
status=>{

console.log(
"SalesPro realtime:",
status
);

}
);


realtimeChannels.push(
channel
);

}


function cleanupRealtime(){

realtimeChannels.forEach(
channel=>{
sb.removeChannel(channel);
}
);

realtimeChannels=[];

}
